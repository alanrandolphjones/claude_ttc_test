<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TTC Stop Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <style>
    :root {
      --bus: #da251d;
      --streetcar: #0a7d3e;
      --both: #7b3fa0;
      --alert: #f08c00;
      --panel-bg: #ffffff;
      --panel-fg: #1d1d1f;
      --muted: #6b6b70;
    }
    @media (prefers-color-scheme: dark) {
      :root { --panel-bg: #1f1f22; --panel-fg: #f2f2f4; --muted: #a1a1a8; }
    }
    html, body { height: 100%; margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background: #e5e3df; }
    #map { position: absolute; inset: 0; }
    #panel {
      position: absolute; top: 12px; left: 56px; z-index: 1000;
      background: var(--panel-bg); color: var(--panel-fg);
      border-radius: 10px; box-shadow: 0 2px 12px rgba(0,0,0,.25);
      padding: 12px 14px; width: 260px; max-width: calc(100vw - 88px); font-size: 14px;
    }
    #panel h1 { font-size: 16px; margin: 0 0 8px; }
    #panel label { display: flex; align-items: center; gap: 6px; margin: 4px 0; cursor: pointer; }
    #panel select, #panel input[type=search] { width: 100%; box-sizing: border-box; margin-top: 6px; padding: 5px 6px; font: inherit; }
    .dash { width: 18px; height: 0; border-top: 4px dashed var(--alert); display: inline-block; }
    .dot { width: 11px; height: 11px; border-radius: 50%; display: inline-block; border: 1.5px solid #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.3); }
    #status { color: var(--muted); margin-top: 8px; font-size: 12.5px; }
    #bar { height: 4px; background: rgba(127,127,127,.25); border-radius: 2px; margin-top: 6px; overflow: hidden; }
    #bar > div { height: 100%; width: 0; background: var(--bus); transition: width .2s; }
    .popup h3 { margin: 0 0 4px; font-size: 14px; }
    .popup .meta { color: #666; font-size: 12px; margin-bottom: 6px; }
    .arrivals { margin-top: 8px; border-top: 1px solid #ddd; padding-top: 6px; min-width: 220px; }
    .arrivals .row { display: flex; align-items: baseline; gap: 8px; margin: 5px 0; }
    .arrivals .row .chip { flex: none; }
    .arrivals .dir { font-size: 12px; color: #444; line-height: 1.3; }
    .arrivals .times { font-weight: 700; font-size: 13px; font-variant-numeric: tabular-nums; }
    .arrivals .none { color: #888; font-size: 12px; }
    .arrivals .updated { color: #888; font-size: 11px; margin-top: 6px; }
    .advisory { margin: 6px 0 8px; padding: 8px 9px; border-radius: 6px; background: #fff4e0; border: 1px solid #f0b54a; color: #4a3000; font-size: 12.5px; line-height: 1.4; }
    .advisory.delay { background: #fffbe6; border-color: #e6cf5a; }
    .advisory.info { background: #eef4fb; border-color: #a9c4e4; color: #12314f; }
    .advisory.upcoming { background: #f3f1f8; border-color: #c4bbdd; color: #2b2340; }
    .advisory.board { background: #eaf6ef; border-color: #8cc8a3; color: #0d3b22; }
    .advisory details { margin-top: 4px; }
    .advisory summary { cursor: pointer; font-weight: 600; }
    .advisory .desc { white-space: pre-line; margin-top: 4px; }
    .advisory ul { margin: 4px 0 0; padding-left: 16px; }
    .advisory li { margin: 3px 0; }
    .advisory b { font-weight: 700; }
    .advisory .head { font-weight: 700; margin-bottom: 3px; }
    .advisory .alt { margin-top: 6px; padding-top: 6px; border-top: 1px dashed rgba(0,0,0,.2); }
    .advisory a.go { color: inherit; font-weight: 600; }
    .advisory .src { margin-top: 4px; font-size: 11.5px; opacity: .8; }
    .arrivals .row.bypassed .times { text-decoration: line-through; color: #999; }
    .arrivals .flag { display: inline-block; font-size: 11px; font-weight: 700; color: #a15c00; margin-left: 4px; text-decoration: none; }
    .arrivals .shuttle { display: inline-block; font-size: 11px; font-weight: 700; color: #fff; background: #555; border-radius: 3px; padding: 0 4px; margin-left: 4px; }
    .chip { display: inline-block; padding: 1px 6px; margin: 2px 2px 0 0; border-radius: 4px; color: #fff; font-size: 12px; font-weight: 600; }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="panel">
    <h1>TTC Bus &amp; Streetcar Stops</h1>
    <label><input type="checkbox" id="showBus" checked> <span class="dot" style="background:var(--bus)"></span> Bus</label>
    <label><input type="checkbox" id="showStreetcar" checked> <span class="dot" style="background:var(--streetcar)"></span> Streetcar</label>
    <label style="color:var(--muted)"><span class="dot" style="background:var(--both)"></span> Served by both</label>
    <label style="color:var(--muted)"><span class="dot" style="background:#fff;box-shadow:0 0 0 2.5px var(--alert)"></span> Detour / no service</label>
    <label><input type="checkbox" id="showDetours" checked> <span class="dash"></span> Detour paths (TTC)</label>
    <select id="routeFilter"><option value="">All routes</option></select>
    <input type="search" id="search" placeholder="Search stop name or number…">
    <div id="bar"><div></div></div>
    <div id="status">Loading routes…</div>
    <div id="alertStatus" style="color:var(--muted);font-size:12.5px;margin-top:4px"></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script>
    // Live data from the TTC's public real-time feed (Umo IQ / NextBus).
    const API = 'https://retro.umoiq.com/service/publicJSONFeed?a=ttc';

    // The live feed doesn't say which routes are streetcars. This list comes from
    // the TTC's GTFS schedule (routes.txt, route_type = 0). Update it if routes change.
    const STREETCAR_ROUTES = new Set(['301','303','304','305','306','310','312',
      '501','503','504','505','506','507','508','509','510','511','512']);

    const COLORS = { bus: '#da251d', streetcar: '#0a7d3e', both: '#7b3fa0' };

    const map = L.map('map', { preferCanvas: true }).setView([43.70, -79.40], 11);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors · Stop data &copy; Toronto Transit Commission'
    }).addTo(map);

    const renderer = L.canvas({ padding: 0.5 });
    const detourLayer = L.layerGroup().addTo(map);   // added first so stops draw on top
    const layer = L.layerGroup().addTo(map);
    const stops = new Map();   // key -> { lat, lon, title, stopId, routes: Map(tag -> title) }
    const routeTitles = new Map();
    const routeDirs = new Map(); // route tag -> [{ title, keys: [stop keys in order] }]
    const stopKey = s => s.stopId || s.tag.replace(/_ar$/, '');

    const $ = id => document.getElementById(id);
    const status = msg => { $('status').textContent = msg; };
    const progress = frac => { $('bar').firstElementChild.style.width = (frac * 100).toFixed(1) + '%'; };

    const asArray = x => x == null ? [] : Array.isArray(x) ? x : [x];
    const isStreetcar = tag => STREETCAR_ROUTES.has(tag);

    async function getJSON(params, tries = 3) {
      for (let i = 0; ; i++) {
        try {
          const res = await fetch(`${API}&${params}`);
          if (!res.ok) throw new Error('HTTP ' + res.status);
          const json = await res.json();
          if (json.Error) throw new Error(json.Error.content || 'API error');
          return json;
        } catch (e) {
          if (i >= tries - 1) throw e;
          await new Promise(r => setTimeout(r, 500 * 2 ** i));
        }
      }
    }

    function addRoute(route) {
      const tag = route.tag;
      routeTitles.set(tag, route.title);
      for (const s of asArray(route.stop)) {
        // "_ar" tags are arrival-only duplicates of a terminal stop.
        const key = stopKey(s);
        let stop = stops.get(key);
        if (!stop) {
          stop = { key, lat: +s.lat, lon: +s.lon, title: s.title, stopId: s.stopId, routes: new Map(), tags: new Map() };
          stops.set(key, stop);
        }
        stop.routes.set(tag, route.title);
        stop.tags.set(tag, s.tag);
      }
      const tagToKey = new Map(asArray(route.stop).map(s => [s.tag, stopKey(s)]));
      routeDirs.set(tag, asArray(route.direction).map(d => ({
        title: d.title, keys: asArray(d.stop).map(x => tagToKey.get(x.tag)).filter(Boolean)
      })));
    }

    function stopKind(stop, routeSet) {
      let bus = false, car = false;
      for (const tag of routeSet) (isStreetcar(tag) ? (car = true) : (bus = true));
      return bus && car ? 'both' : car ? 'streetcar' : 'bus';
    }

    function popupHtml(stop) {
      const tags = [...stop.routes.keys()].sort((a, b) => parseInt(a) - parseInt(b));
      const chips = tags.map(t =>
        `<span class="chip" style="background:${isStreetcar(t) ? COLORS.streetcar : COLORS.bus}" title="${escapeHtml(stop.routes.get(t))}">${t}</span>`
      ).join('');
      return `<div class="popup"><h3>${escapeHtml(stop.title)}</h3>
        <div class="meta">${stop.stopId ? 'Stop #' + stop.stopId : 'No stop number'}${cornerOf(stop) ? ' · ' + escapeHtml(cornerOf(stop, true)) : ''} · ${tags.length} route${tags.length === 1 ? '' : 's'}</div>
        ${chips}
        <div class="arrivals">Checking next arrivals…</div></div>`;
    }

    // Leaflet re-runs the content function whenever the popup updates, so keep one
    // element per stop; arrival times written into it then survive popup.update().
    // Keep popups clear of the filter panel (it covers the top of the map on phones).
    function popupOptions() {
      const panel = $('panel').getBoundingClientRect();
      return { maxWidth: 300, maxHeight: Math.round(window.innerHeight * 0.55), autoPanPaddingTopLeft: L.point(10, panel.bottom + 10), autoPanPaddingBottomRight: L.point(10, 30) };
    }

    function popupEl(stop) {
      if (!stop.el) {
        stop.el = document.createElement('div');
        stop.el.innerHTML = popupHtml(stop);
      }
      return stop.el;
    }

    // ---- Service alerts & detours ---------------------------------------------
    // TTC alerts (alerts.ttc.ca) list the stop numbers each detour or closure skips.
    // The TTC doesn't allow browsers to read that feed directly, so server.js relays it.
    const ALERTS_URL = 'api/alerts';
    const BYPASS = new Set(['DETOUR', 'NO_SERVICE', 'REDUCED_SERVICE', 'STOP_MOVED', 'MODIFIED_SERVICE']);
    let alerts = [], alertsOk = null, affectedKeys = new Set();

    // alerts.ttc.ca marks "no end" as year 0001; GTFS-realtime alerts may have several periods.
    const periodsOf = a => (a.activePeriods?.length ? a.activePeriods : [a.activePeriod || {}]).map(p => ({
      start: p.start ? Date.parse(p.start) : -Infinity,
      end: !p.end || p.end.startsWith('0001') ? Infinity : Date.parse(p.end),
    }));
    const UPCOMING_MS = 14 * 24 * 3600 * 1000;   // also show planned changes starting in the next two weeks
    function timing(a, now = Date.now()) {
      const ps = periodsOf(a);
      if (ps.some(p => p.start <= now && now < p.end)) return { state: 'active' };
      const next = ps.filter(p => p.start > now && p.start - now < UPCOMING_MS).sort((x, y) => x.start - y.start)[0];
      return next ? { state: 'upcoming', ...next } : { state: 'inactive' };
    }

    async function loadAlerts() {
      try {
        const res = await fetch(ALERTS_URL, { cache: 'no-store' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const json = await res.json();
        alerts = asArray(json.routes)
          .map(a => ({ ...a, timing: timing(a) }))
          .filter(a => a.effect && a.effect !== 'NO_EFFECT' && a.timing.state !== 'inactive')
          // An upcoming alert never means "not stopping here" yet.
          .map(a => ({ ...a, upcoming: a.timing.state === 'upcoming', stopSet: new Set(asArray(a.stops).map(String)) }));
        alertsOk = true;
      } catch (e) {
        alertsOk = false;
      }
      const surface = alerts.filter(a => !a.upcoming && (routeTitles.has(a.route) || !routeTitles.size));
      const routesHit = new Set(surface.map(a => a.route)).size;
      const upcoming = new Set(alerts.filter(a => a.upcoming && routeTitles.has(a.route)).map(a => a.route)).size;
      const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;
      $('alertStatus').textContent = alertsOk
        ? `Service changes or alerts on ${plural(routesHit, 'route')} now` + (upcoming ? ` · ${upcoming} more planned soon` : '')
        : 'Detour info unavailable (TTC alerts could not be loaded).';

      const next = new Set();
      for (const [key, stop] of stops) if (stopDisruptions(stop).some(d => d.bypass)) next.add(key);
      const changed = next.size !== affectedKeys.size || [...next].some(k => !affectedKeys.has(k));
      affectedKeys = next;
      // Redraw only when something changed and no popup is open (redrawing closes it).
      if (changed && stops.size && !map._popup?.isOpen()) updateStatus();
    }

    const dirWord = s => (String(s).match(/\b(north|south|east|west)/i) || [])[1]?.toLowerCase();
    function dirMatches(alertDir, dirTitle) {
      const a = dirWord(alertDir);
      return !a || /both/i.test(alertDir) || dirWord(dirTitle) === a;
    }

    // Every active alert touching this stop, per route.
    function stopDisruptions(stop) {
      const out = [];
      for (const a of alerts) {
        if (!stop.routes.has(a.route)) continue;
        const hitsStop = stop.stopId && a.stopSet.has(stop.stopId);
        if (!hitsStop && a.stopSet.size) continue;             // alert is about other stops on this route
        out.push({ alert: a, route: a.route, bypass: hitsStop && !a.upcoming && BYPASS.has(a.effect), routeWide: !a.stopSet.size });
      }
      // Most urgent first: skipped here, then current changes, then upcoming ones.
      const rank = d => d.bypass ? 0 : d.alert.upcoming ? 2 : 1;
      return out.sort((x, y) => rank(x) - rank(y));
    }

    function metres(a, b) {
      const R = 6371000, rad = Math.PI / 180;
      const dLat = (b.lat - a.lat) * rad, dLon = (b.lon - a.lon) * rad;
      const h = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * rad) * Math.cos(b.lat * rad) * Math.sin(dLon / 2) ** 2;
      return 2 * R * Math.asin(Math.sqrt(h));
    }
    const walk = m => `${m < 1000 ? Math.round(m / 10) * 10 + ' m' : (m / 1000).toFixed(1) + ' km'}, about ${Math.max(1, Math.round(m / 80))} min walk`;

    // Nearest stop on the same route and direction that the alert doesn't skip.
    function nearestRegularStop(stop, d) {
      const key = stopKey({ stopId: stop.stopId, tag: stop.tags.get(d.route) || '' });
      let best = null;
      for (const dir of routeDirs.get(d.route) || []) {
        if (!dir.keys.includes(key) || !dirMatches(d.alert.direction, dir.title)) continue;
        for (const k of dir.keys) {
          const s = stops.get(k);
          if (!s || s === stop || (s.stopId && d.alert.stopSet.has(s.stopId))) continue;
          const m = metres(stop, s);
          if (!best || m < best.m) best = { stop: s, m };
        }
      }
      return best;
    }

    // Street names a detour runs on, from text like "Detour via Church St, Maitland St and Jarvis St".
    const SUFFIX = /\b(st|street|ave|avenue|rd|road|blvd|boulevard|dr|drive|cres|crescent|crt|court|pkwy|parkway|hwy|ln|lane|way|cir|circle|trl|trail|gate|gdns|pl|place|sq|e|w|n|s|east|west|north|south)\b\.?/g;
    const streetKey = name => name.toLowerCase().replace(/[.']/g, '').replace(SUFFIX, ' ').replace(/\s+/g, ' ').trim();
    function detourStreets(text) {
      const out = new Set();
      const grab = re => { const m = text.match(re); if (m) m[1].split(/,\s*|\s+and\s+|\s*&\s*/i).forEach(n => { const k = streetKey(n); if (k) out.add(k); }); };
      grab(/\bvia\s+(.+?)(?:\s+(?:due to|between|from|until|while|because)\b|[.;]|$)/i);
      grab(/\b(?:running|operating|diverting|divert)\s+(?:on|along)\s+(.+?)(?:\s+(?:due to|between|from|until|while)\b|[.;]|$)/i);
      return out;
    }

    // Closest existing stop on one of the detour streets (detoured vehicles use stops along the detour).
    function nearestDetourStop(stop, d) {
      const streets = detourStreets(`${d.alert.title || ''} ${d.alert.headerText || ''} ${d.alert.description || ''}`);
      if (!streets.size) return null;
      let best = null;
      for (const s of stops.values()) {
        if (s === stop || (s.stopId && d.alert.stopSet.has(s.stopId))) continue;
        const m = metres(stop, s);
        if (m > 2000 || (best && m >= best.m)) continue;
        const street = streetKey(s.title.split(/\s+at\s+/i)[0]);
        if (streets.has(street)) best = { stop: s, m, street };
      }
      return best;
    }

    const stopLink = s => `<a class="go" href="#" data-goto="${escapeHtml(stopKeyOf(s))}">${escapeHtml(s.title)}</a>${s.stopId ? ' (#' + s.stopId + ')' : ''}` +
      (cornerOf(s) ? `, <b>${escapeHtml(cornerOf(s))}</b>` : '');

    // ---- Which corner is a stop on? -----------------------------------------
    // Stops on opposite corners often share a name ("Bay St at College St"). The corner follows
    // from the direction vehicles travel through the stop (they stop on the right-hand side)
    // and whether the stop is before or after the cross street, judged against the middle of
    // all the stops at that intersection.
    const M_LAT = 110574, M_LON = 80487;
    const CARD = ['north', 'east', 'south', 'west'];
    const cardOf = deg => CARD[Math.round((((deg % 360) + 360) % 360) / 90) % 4];
    const bearing = (a, b) => (Math.atan2((b.lon - a.lon) * M_LON, (b.lat - a.lat) * M_LAT) * 180 / Math.PI + 360) % 360;
    const UNIT = { north: [0, 1], east: [1, 0], south: [0, -1], west: [-1, 0] };
    const RIGHT_OF = { north: 'east', east: 'south', south: 'west', west: 'north' };
    const OPPOSITE = { north: 'south', south: 'north', east: 'west', west: 'east' };

    function splitTitle(t) {
      const [main, cross] = t.split(/\s+at\s+/i);
      return { main: (main || '').trim(), cross: (cross || '').replace(/\s+-\s+.*$/, '').replace(/\s+(north|south|east|west)\s+side$/i, '').trim() };
    }

    // Direction of travel arriving at the stop, from the stop before it on any route.
    function travelDir(stop) {
      for (const route of stop.routes.keys()) for (const d of routeDirs.get(route) || []) {
        const i = d.keys.indexOf(stop.key);
        if (i < 0) continue;
        const prev = i > 0 && stops.get(d.keys[i - 1]), next = i + 1 < d.keys.length && stops.get(d.keys[i + 1]);
        if (prev && metres(prev, stop) > 15) return cardOf(bearing(prev, stop));
        if (next && metres(stop, next) > 15) return cardOf(bearing(stop, next));
      }
      return null;
    }

    function intersectionCentre(stop, main, cross) {
      const a = streetKey(main), b = streetKey(cross);
      if (!a || !b) return null;
      let n = 0, latMin = 90, latMax = -90, lonMin = 180, lonMax = -180;
      for (const s of stops.values()) {
        if (Math.abs(s.lat - stop.lat) > 0.0012 || Math.abs(s.lon - stop.lon) > 0.0016) continue;   // ~130 m box
        const t = splitTitle(s.title), x = streetKey(t.main), y = streetKey(t.cross);
        if (!((x === a && y === b) || (x === b && y === a))) continue;
        n++; latMin = Math.min(latMin, s.lat); latMax = Math.max(latMax, s.lat); lonMin = Math.min(lonMin, s.lon); lonMax = Math.max(lonMax, s.lon);
      }
      return n >= 2 ? { lat: (latMin + latMax) / 2, lon: (lonMin + lonMax) / 2 } : null;
    }

    // "southeast corner" (or "east side" mid-block); withTravel adds "northbound".
    function cornerOf(stop, withTravel = false) {
      if (stop.corner === undefined) {
        const dir = travelDir(stop);
        let label = null;
        if (dir) {
          const side = RIGHT_OF[dir];
          const { main, cross } = splitTitle(stop.title);
          const c = cross && intersectionCentre(stop, main, cross);
          label = side + ' side';
          if (c) {
            const [ux, uy] = UNIT[dir];
            const along = (stop.lon - c.lon) * M_LON * ux + (stop.lat - c.lat) * M_LAT * uy;
            if (Math.abs(along) >= 6) {
              const pos = along < 0 ? OPPOSITE[dir] : dir;                // before the cross street, or past it
              const ns = [pos, side].find(x => x === 'north' || x === 'south');
              const ew = [pos, side].find(x => x === 'east' || x === 'west');
              if (ns && ew) label = ns + ew + ' corner';
            }
          }
        }
        stop.corner = label;
        stop.travel = dir;
      }
      if (!stop.corner) return '';
      return withTravel && stop.travel ? `${stop.corner}, ${stop.travel}bound` : stop.corner;
    }
    const stopKeyOf = s => s.key;
    const SHUTTLE_RE = /shuttle|replacement bus|buses are (running|replacing)|bus(es)? replac/i;

    function advisoryHtml(stop, disruptions) {
      if (alertsOk === false) return `<div class="advisory info">Detour info is unavailable right now, so these times can't be checked against TTC service alerts.</div>`;
      // The same TTC alert often covers several routes (306 and 506): show it once.
      const seen = new Map();
      for (const d of disruptions) {
        const k = d.bypass ? d.route + '|' + d.alert.id : 'a|' + d.alert.id + '|' + d.alert.source;
        if (seen.has(k)) seen.get(k).routes.push(d.route); else seen.set(k, { ...d, routes: [d.route] });
      }
      return [...seen.values()].map(d => {
        const a = d.alert, rt = escapeHtml(d.routes.join(' / '));
        const text = escapeHtml(a.headerText || a.title || '');
        const dirNote = a.direction && !/both/i.test(a.direction) ? ` ${escapeHtml(a.direction.toLowerCase())}` : '';
        if (!d.bypass) {
          const cls = a.upcoming ? 'upcoming' : a.effect === 'SIGNIFICANT_DELAYS' ? 'delay' : 'info';
          const head = a.upcoming ? `${rt}: planned change ${escapeHtml(whenText(a.timing))}`
            : `${rt}: ${escapeHtml(a.effectDesc || 'Service alert')}${d.routeWide ? ' on this route' : ' at this stop'}`;
          const summary = escapeHtml(cleanHeader(a.headerText || a.title || '', d.route));
          const desc = a.description && a.description !== a.headerText ? a.description : '';
          return `<div class="advisory ${cls}"><div class="head">${head}</div>${summary}` +
            (desc ? `<details${a.upcoming ? '' : ' open'}><summary>Details</summary><div class="desc">${escapeHtml(desc)}</div></details>` : '') +
            (a.url ? `<div class="src"><a class="go" href="${escapeHtml(a.url)}" target="_blank" rel="noopener">TTC advisory</a></div>` : '') +
            `</div>`;
        }
        let html = `<div class="advisory"><div class="head">${rt}${dirNote} is not stopping here</div>${text}`;
        const regular = nearestRegularStop(stop, d);
        const detour = nearestDetourStop(stop, d);
        if (detour && (!regular || detour.stop !== regular.stop) && (!regular || detour.m < regular.m * 1.5))
          html += `<div class="alt">Closest stop on the detour path: ${stopLink(detour.stop)}, ${walk(detour.m)}.</div>`;
        if (regular)
          html += `<div class="alt">Nearest stop where ${rt} still stops normally: ${stopLink(regular.stop)}, ${walk(regular.m)}.</div>`;
        if (a.shuttleType || SHUTTLE_RE.test(`${a.title} ${a.headerText} ${a.description}`))
          html += `<div class="alt"><b>Replacement buses:</b> ${escapeHtml(a.shuttleType && !/^running$/i.test(a.shuttleType) ? a.shuttleType : 'the TTC says shuttle buses are running')}` +
                  `${a.shuttleStart ? ' from ' + escapeHtml(a.shuttleStart) : ''}${a.shuttleEnd ? ' to ' + escapeHtml(a.shuttleEnd) : ''}.</div>`;
        html += `<div class="src">Source: TTC service alerts</div></div>`;
        return html;
      }).join('');
    }

    // TTC headers sometimes start with a dash or repeat the route ("506 Carlton – ...").
    const cleanHeader = (t, route) => t.replace(/^\s*[–—-]\s*/, '').trim();
    const TZ = { timeZone: 'America/Toronto' };
    function whenText(t) {
      const day = new Date(t.start).toLocaleDateString('en-CA', { ...TZ, weekday: 'short', month: 'short', day: 'numeric' });
      const time = ms => new Date(ms).toLocaleTimeString('en-CA', { ...TZ, hour: 'numeric', minute: '2-digit' });
      return `starting ${day}, ${time(t.start)}` + (Number.isFinite(t.end) ? ` until ${new Date(t.end).toLocaleDateString('en-CA', { ...TZ, month: 'short', day: 'numeric' }) === new Date(t.start).toLocaleDateString('en-CA', { ...TZ, month: 'short', day: 'numeric' }) ? time(t.end) : new Date(t.end).toLocaleDateString('en-CA', { ...TZ, weekday: 'short', month: 'short', day: 'numeric' })}` : '');
    }

    // ---- "Does my direction stop here?" -------------------------------------
    // Each side of the street is its own stop, so a stop normally serves one direction and the
    // opposite direction stops across the street. If a route has no stop for some direction
    // anywhere near this corner (a detour, a one-way street, a replacement bus on another road),
    // say so and list where that direction can be boarded instead.
    const NEARBY_M = 120, ALT_MAX_M = 1500;
    const DIR_NAME = { north: 'Northbound', south: 'Southbound', east: 'Eastbound', west: 'Westbound' };

    function missingDirections(stop) {
      const out = [];
      for (const route of stop.routes.keys()) {
        // Only when the TTC reports a change on this route now; otherwise loops, terminals and
        // one-way streets would trigger it on normal days.
        if (!alerts.some(a => a.route === route && !a.upcoming)) continue;
        const dirs = routeDirs.get(route) || [];
        // A route's first or last stop has no opposite direction by nature.
        if (dirs.some(d => d.keys[0] === stop.key || d.keys[d.keys.length - 1] === stop.key)) continue;
        const here = new Set(dirs.filter(d => d.keys.includes(stop.key)).map(d => dirWord(d.title)));
        for (const w of new Set(dirs.map(d => dirWord(d.title)).filter(Boolean))) {
          if (here.has(w)) continue;
          const opts = [];
          for (const d of dirs.filter(d => dirWord(d.title) === w)) {
            let best = null;
            for (const k of d.keys) {
              const s = stops.get(k);
              if (!s) continue;
              const m = metres(stop, s);
              if (!best || m < best.m) best = { stop: s, m };
            }
            if (best) opts.push({ dir: d, ...best });
          }
          if (!opts.length || opts.some(o => o.m <= NEARBY_M)) continue;   // boards across the street: normal
          const near = opts.filter(o => o.m <= ALT_MAX_M).sort((a, b) => a.m - b.m);
          if (near.length) out.push({ route, word: w, opts: near });
        }
      }
      return out;
    }

    function boardingHtml(stop) {
      // Routes sharing the same alternatives (e.g. 306 and 506) get one box.
      const groups = new Map();
      for (const x of missingDirections(stop)) {
        const sig = x.word + '|' + x.opts.map(o => o.stop.key + (/bus/i.test(o.dir.title) ? 'b' : 's')).join(',');
        if (!groups.has(sig)) groups.set(sig, { ...x, routes: [] });
        groups.get(sig).routes.push(x.route);
      }
      return [...groups.values()].map(x => {
        const items = x.opts.map(o => {
          // "West - 506 Carlton towards High Park" -> "Carlton towards High Park" (shared by 306/506).
          const name = o.dir.title.replace(/^\w+\s*-\s*/, '').replace(/^\d+[a-z]?\s+/i, '');
          const kind = isStreetcar(x.route) ? (/bus/i.test(o.dir.title) ? ' (bus)' : ' (streetcar)') : '';
          return `<li><b>${escapeHtml(name)}${kind}</b>: ${stopLink(o.stop)}, ${walk(o.m)}</li>`;
        }).join('');
        return `<div class="advisory board"><div class="head">${DIR_NAME[x.word]} ${escapeHtml(x.routes.join(' / '))} doesn't stop at this corner right now</div>` +
          `Board ${DIR_NAME[x.word].toLowerCase()} at:<ul>${items}</ul></div>`;
      }).join('');
    }

    // ---- Detour paths (TTC GTFS-realtime trip modifications, via server.js) ----------------
    let detours = [];
    const torontoYmd = () => new Date().toLocaleDateString('en-CA', { timeZone: 'America/Toronto' }).replace(/-/g, '');
    const ymdText = d => new Date(+d.slice(0, 4), +d.slice(4, 6) - 1, +d.slice(6)).toLocaleDateString('en-CA', { weekday: 'short', month: 'short', day: 'numeric' });

    async function loadDetours() {
      try {
        const res = await fetch('api/detours', { cache: 'no-store' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        detours = (await res.json()).detours || [];
      } catch { detours = []; }
      drawDetours();
    }

    function drawDetours() {
      detourLayer.clearLayers();
      if (!$('showDetours').checked) return;
      const routeTag = $('routeFilter').value, today = torontoYmd();
      for (const d of detours) {
        if (routeTag && d.route !== routeTag) continue;
        const running = d.serviceDates.includes(today);
        const dates = d.serviceDates.length ? `${ymdText(d.serviceDates[0])} to ${ymdText(d.serviceDates[d.serviceDates.length - 1])}` : '';
        L.polyline(d.path, { renderer, color: running ? '#f08c00' : '#8a6fc0', weight: 5, opacity: 0.9, dashArray: '10 7', lineCap: 'round' })
          .bindPopup(`<div class="popup"><h3>${escapeHtml(d.route)} detour</h3>
            <div class="meta">Towards ${escapeHtml(d.headsigns.join(', '))}</div>
            ${running ? 'Running today' : 'Planned'}${dates ? ' · ' + escapeHtml(dates) : ''}<br>
            <span class="meta">Path from the TTC's detour feed. The dashed line is where vehicles leave the regular route.</span></div>`)
          .addTo(detourLayer);
      }
    }

    function detourNoteHtml(stop) {
      const routes = [...stop.routes.keys()].filter(r => detours.some(d => d.route === r));
      if (!routes.length) return '';
      return `<div class="advisory info"><b>${escapeHtml(routes.join(' / '))}</b> ${routes.length === 1 ? 'has' : 'have'} a detour path from the TTC. ` +
        routes.map(r => `<a class="go" href="#" data-detour="${escapeHtml(r)}">Show ${escapeHtml(r)} detour</a>`).join(' · ') + `</div>`;
    }

    document.addEventListener('click', e => {
      const a = e.target.closest('a[data-detour]');
      if (!a) return;
      e.preventDefault();
      const pts = detours.filter(d => d.route === a.dataset.detour).flatMap(d => d.path);
      if (!pts.length) return;
      if (!$('showDetours').checked) { $('showDetours').checked = true; drawDetours(); }
      map.closePopup();
      map.fitBounds(pts, { padding: [60, 60], maxZoom: 17 });
    });

    // Tapping a suggested stop jumps to it and opens its popup.
    document.addEventListener('click', e => {
      const a = e.target.closest('a[data-goto]');
      if (!a) return;
      e.preventDefault();
      const s = stops.get(a.dataset.goto);
      if (!s) return;
      if (!s.marker || !layer.hasLayer(s.marker)) { $('search').value = ''; $('routeFilter').value = ''; updateStatus(); }
      map.setView([s.lat, s.lon], Math.max(map.getZoom(), 16));
      s.marker?.openPopup();
    });

    // ---- Next-vehicle predictions -------------------------------------------
    let arrivalsTimer = null, arrivalsSeq = 0;

    function stopArrivals() { clearInterval(arrivalsTimer); arrivalsTimer = null; arrivalsSeq++; }

    function startArrivals(stop, popup) {
      stopArrivals();
      const seq = arrivalsSeq;
      const refresh = async () => {
        let html;
        try { html = arrivalsHtml(await fetchPredictions(stop), stop); }
        catch (e) { html = `<div class="none">Couldn't load arrival times (${escapeHtml(e.message)}).</div>`; }
        if (seq !== arrivalsSeq) return;   // popup closed or another stop opened meanwhile
        const el = popupEl(stop).querySelector('.arrivals');
        if (el) { el.innerHTML = html; popup.update(); }
      };
      refresh();
      arrivalsTimer = setInterval(refresh, 30000);
    }

    async function fetchPredictions(stop) {
      if (stop.stopId) {
        return asArray((await getJSON(`command=predictions&stopId=${encodeURIComponent(stop.stopId)}`, 2)).predictions);
      }
      // Stops without a public stop number: ask per route, ignoring routes that error.
      const results = await Promise.allSettled([...stop.tags].map(([r, s]) =>
        getJSON(`command=predictions&r=${encodeURIComponent(r)}&s=${encodeURIComponent(s)}`, 1)));
      const ok = results.filter(x => x.status === 'fulfilled');
      if (!ok.length && results.length) throw results[0].reason;
      return ok.flatMap(x => asArray(x.value.predictions));
    }

    function arrivalsHtml(predictions, stop) {
      const disruptions = stopDisruptions(stop);
      const bypassed = (route, dirTitle) => disruptions.some(d => d.bypass && d.route === route && dirMatches(d.alert.direction, dirTitle));
      const rows = [];
      for (const p of predictions) {
        for (const d of asArray(p.direction)) {
          const list = asArray(d.prediction).filter(x => +x.seconds >= 0).sort((a, b) => a.seconds - b.seconds).slice(0, 3);
          if (!list.length) continue;
          rows.push({
            route: p.routeTag, dir: d.title, first: +list[0].seconds, preds: list.map(x => +x.seconds),
            bypassed: bypassed(p.routeTag, d.title),
            // Streetcar routes run buses on "...Bus" branches when streetcars are replaced.
            shuttle: isStreetcar(p.routeTag) && list.some(x => /bus/i.test(x.dirTag || '')),
          });
        }
      }
      rows.sort((a, b) => a.bypassed - b.bypassed || a.first - b.first);
      const advisory = advisoryHtml(stop, disruptions.filter(d => d.bypass)) + boardingHtml(stop) + detourNoteHtml(stop) +
                       (alertsOk === false ? '' : advisoryHtml(stop, disruptions.filter(d => !d.bypass)));
      const fmt = sec => sec < 60 ? 'Due' : Math.floor(sec / 60) + ' min';
      const now = new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
      if (!rows.length) return advisory + `<div class="none">No vehicles predicted right now.</div><div class="updated">Checked ${now}</div>`;
      return advisory + rows.map(r => `<div class="row${r.bypassed ? ' bypassed' : ''}">
          <span class="chip" style="background:${isStreetcar(r.route) && !r.shuttle ? COLORS.streetcar : COLORS.bus}">${escapeHtml(r.route)}</span>
          <div><div class="times">${r.preds.map(fmt).join(', ')}</div>${r.bypassed ? '<span class="flag">Detoured: won\'t stop here</span>' : ''}${r.shuttle ? '<span class="shuttle">BUS</span>' : ''}
          <div class="dir">${escapeHtml(r.dir)}</div></div>
        </div>`).join('') + `<div class="updated">Live · updated ${now} · refreshes every 30s</div>`;
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    function render() {
      const showBus = $('showBus').checked, showCar = $('showStreetcar').checked;
      const routeTag = $('routeFilter').value;
      const q = $('search').value.trim().toLowerCase();
      layer.clearLayers();
      let shown = 0;
      for (const [key, stop] of stops) {
        if (routeTag && !stop.routes.has(routeTag)) continue;
        if (q && !stop.title.toLowerCase().includes(q) && !(stop.stopId || '').includes(q)) continue;
        // Only count route types the user has switched on.
        const visibleRoutes = [...stop.routes.keys()].filter(t => isStreetcar(t) ? showCar : showBus);
        if (!visibleRoutes.length) continue;
        const kind = stopKind(stop, visibleRoutes);
        const hit = affectedKeys.has(key);
        stop.marker = L.circleMarker([stop.lat, stop.lon], {
          renderer, radius: hit ? 5 : 4, weight: hit ? 3 : 1, color: hit ? '#f08c00' : '#fff', fillColor: COLORS[kind], fillOpacity: 0.9
        }).bindPopup(() => popupEl(stop), popupOptions())
          .on('popupopen', e => startArrivals(stop, e.popup))
          .on('popupclose', stopArrivals)
          .addTo(layer);
        shown++;
      }
      return shown;
    }

    let loadedCount = 0, routeCount = 0;
    function updateStatus(done = loadedCount, total = routeCount) {
      loadedCount = done; routeCount = total;
      const shown = render();
      status(`${shown.toLocaleString()} stop${shown === 1 ? '' : 's'} shown · ${stops.size.toLocaleString()} total` +
             (done < total ? ` · loading routes ${done}/${total}…` : ` · ${total} routes`));
    }

    async function load() {
      let routes;
      try {
        routes = asArray((await getJSON('command=routeList')).route);
      } catch (e) {
        status('Could not reach the TTC feed: ' + e.message);
        return;
      }

      let done = 0, failed = [], lastRender = 0;
      const queue = routes.slice();
      async function worker() {
        while (queue.length) {
          const r = queue.shift();
          try {
            const json = await getJSON(`command=routeConfig&r=${encodeURIComponent(r.tag)}&terse`);
            addRoute(json.route);
          } catch (e) {
            failed.push(r.tag);
          }
          done++;
          progress(done / routes.length);
          // Redraw at most every 750 ms while loading so the map fills in progressively.
          if (Date.now() - lastRender > 750) { lastRender = Date.now(); updateStatus(done, routes.length); }
        }
      }
      await Promise.all(Array.from({ length: 8 }, worker));

      const sel = $('routeFilter');
      [...routeTitles.entries()]
        .sort((a, b) => parseInt(a[0]) - parseInt(b[0]))
        .forEach(([tag, title]) => sel.add(new Option(`${title}${isStreetcar(tag) ? ' (streetcar)' : ''}`, tag)));

      updateStatus(done, routes.length);
      if (failed.length) $('status').textContent += ` · failed: ${failed.join(', ')}`;
      $('bar').style.display = 'none';
      await Promise.all([loadAlerts(), loadDetours()]);
    }

    ['showBus', 'showStreetcar', 'routeFilter'].forEach(id => $(id).addEventListener('change', () => updateStatus()));
    let t;
    $('search').addEventListener('input', () => { clearTimeout(t); t = setTimeout(() => updateStatus(), 200); });

    $('routeFilter').addEventListener('change', () => {
      const tag = $('routeFilter').value;
      if (!tag) return;
      const pts = [...stops.values()].filter(s => s.routes.has(tag)).map(s => [s.lat, s.lon]);
      if (pts.length) map.fitBounds(pts, { padding: [40, 40] });
    });

    load();
    setInterval(loadAlerts, 2 * 60 * 1000);
    setInterval(loadDetours, 5 * 60 * 1000);
    $('showDetours').addEventListener('change', drawDetours);
    $('routeFilter').addEventListener('change', drawDetours);
  </script>
</body>
</html>
