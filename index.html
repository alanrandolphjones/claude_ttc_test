          fillColor: kind === 'both' ? COLORS.bus : COLORS[kind], fillColor2: COLORS.streetcar, fillOpacity: 0.9
        }).bindPopup(() => popupEl(stop), popupOptions())
          .on('popupopen', e => startArrivals(stop, e.popup))
          .on('popupclose', stopArrivals)
          .addTo(layer);
        shown++;
      }
      return shown;
    }

    // Markers grow as you zoom in: dots when the whole city is in view, easy tap targets on a street.
    const RADIUS = { 10: 1.5, 11: 2, 12: 2.5, 13: 3.5, 14: 4.5, 15: 6, 16: 7.5, 17: 9, 18: 10 };
    const stopRadius = (z, hit) => (RADIUS[Math.max(10, Math.min(18, Math.round(z)))] ?? 10) + (hit ? 1.5 : 0);
    const stopWeight = (z, hit) => hit ? (z >= 14 ? 3 : 2) : (z >= 14 ? 1.5 : z >= 12 ? 1 : 0.5);
    map.on('zoomend', () => {
      const z = map.getZoom();
      for (const st of stops.values()) if (st.marker) st.marker.setStyle({ radius: stopRadius(z, st.hit), weight: stopWeight(z, st.hit) });
      for (const g of ghosts) g.marker?.setStyle({ radius: stopRadius(z, false), weight: stopWeight(z, false) });
    });

    let loadedCount = 0, routeCount = 0;
    function updateStatus(done = loadedCount, total = routeCount) {
      loadedCount = done; routeCount = total;
      const shown = render();
      status(`${shown.toLocaleString()} stop${shown === 1 ? '' : 's'} shown · ${stops.size.toLocaleString()} total` +
             (done < total ? ` · loading routes ${done}/${total}…` : ` · ${total} routes`));
    }

    async function load() {
      let routes;
      try {
        routes = asArray((await getJSON('command=routeList')).route);
      } catch (e) {
        status('Could not reach the TTC feed: ' + e.message);
        return;
      }

      let done = 0, failed = [], lastRender = 0;
      const queue = routes.slice();
      async function worker() {
        while (queue.length) {
          const r = queue.shift();
          try {
            const json = await getJSON(`command=routeConfig&r=${encodeURIComponent(r.tag)}&terse`);
            addRoute(json.route);
          } catch (e) {
            failed.push(r.tag);
          }
          done++;
          progress(done / routes.length);
          // Redraw at most every 750 ms while loading so the map fills in progressively.
          if (Date.now() - lastRender > 750) { lastRender = Date.now(); updateStatus(done, routes.length); }
        }
      }
      await Promise.all(Array.from({ length: 8 }, worker));

      const sel = $('routeFilter');
      [...routeTitles.entries()]
        .sort((a, b) => parseInt(a[0]) - parseInt(b[0]))
        .forEach(([tag, title]) => {
          sel.add(new Option(`${title}${isStreetcar(tag) ? ' (streetcar)' : ''}`, tag));
          for (const code of busBranches(tag)) sel.add(new Option(`${code}-${title.replace(/^\d+-/, '')} (replacement bus)`, code));
        });

      updateStatus(done, routes.length);
      if (failed.length) $('status').textContent += ` · failed: ${failed.join(', ')}`;
      $('bar').style.display = 'none';
      await Promise.all([loadAlerts(), loadDetours(), loadDetourStops()]);
      await loadGhosts();                       // needs stops and alerts
    }

    ['showBus', 'showStreetcar', 'routeFilter'].forEach(id => $(id).addEventListener('change', () => updateStatus()));
    let t;
    $('search').addEventListener('input', () => { clearTimeout(t); t = setTimeout(() => updateStatus(), 200); });

    $('routeFilter').addEventListener('change', () => {
      const tag = $('routeFilter').value;
      if (tag) highlightRoute(tag, { fromFilter: true }); else clearHighlight();
    });

    // Collapsible panel: starts collapsed on phones; remembers the viewer's choice.
    function setPanel(open, remember) {
      $('panel').classList.toggle('collapsed', !open);
      $('panelToggle').setAttribute('aria-expanded', String(open));
      if (remember) try { localStorage.setItem('panelOpen', open ? '1' : '0'); } catch { /* storage unavailable */ }
      // Popups keep clear of the panel, whose height just changed.
      const pad = popupOptions().autoPanPaddingTopLeft;
      for (const st of stops.values()) { const pp = st.marker?.getPopup(); if (pp) pp.options.autoPanPaddingTopLeft = pad; }
    }
    let savedPanel = null;
    try { savedPanel = localStorage.getItem('panelOpen'); } catch { /* storage unavailable */ }
    setPanel(savedPanel ? savedPanel === '1' : window.innerWidth >= 700, false);
    $('panelToggle').addEventListener('click', () => setPanel($('panel').classList.contains('collapsed'), true));

    // ---- "Where am I?" button, under the zoom buttons -----------------------------------
    const youLayer = L.layerGroup().addTo(map);
    let toastTimer;
    function toast(msg) { const t = $('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 4000); }
    const LocateControl = L.Control.extend({
      options: { position: 'topleft' },
      onAdd() {
        const bar = L.DomUtil.create('div', 'leaflet-bar');
        const btn = L.DomUtil.create('button', 'locate-btn', bar);
        btn.type = 'button'; btn.title = 'Show my location'; btn.setAttribute('aria-label', 'Show my location');
        btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="#1d1d1f" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2.5" fill="#1d1d1f"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>';
        L.DomEvent.disableClickPropagation(bar);
        L.DomEvent.on(btn, 'click', () => {
          if (!navigator.geolocation) return toast('This browser can\'t share your location.');
          btn.classList.add('busy');
          navigator.geolocation.getCurrentPosition(pos => {
            btn.classList.remove('busy');
            const ll = [pos.coords.latitude, pos.coords.longitude], acc = Math.min(pos.coords.accuracy || 0, 2000);
            youLayer.clearLayers();
            L.circle(ll, { renderer, radius: acc, color: '#1a73e8', weight: 1, fillColor: '#1a73e8', fillOpacity: 0.12, interactive: false }).addTo(youLayer);
            L.circleMarker(ll, { renderer, radius: 7, color: '#fff', weight: 2.5, fillColor: '#1a73e8', fillOpacity: 1, interactive: false }).addTo(youLayer);
            map.setView(ll, Math.max(map.getZoom(), 16));
            if (ll[0] < 43.55 || ll[0] > 43.9 || ll[1] < -79.7 || ll[1] > -79.05) toast('You\'re outside the TTC area.');
          }, err => {
            btn.classList.remove('busy');
            toast(err.code === 1 ? 'Location is off for this site. Turn it on in Settings → Privacy → Location Services (Safari Websites).' : 'Couldn\'t find your location. Try again.');
          }, { enableHighAccuracy: true, timeout: 15000, maximumAge: 30000 });
        });
        return bar;
      },
    });
    new LocateControl().addTo(map);

    load();
    loadNetwork();
    setInterval(loadAlerts, 2 * 60 * 1000);
    setInterval(loadDetours, 5 * 60 * 1000);
    setInterval(loadDetourStops, 90 * 1000);
    setInterval(() => loadNetwork(), 10 * 60 * 1000);
    setInterval(loadGhosts, 15 * 60 * 1000);
    $('routeFilter').addEventListener('change', drawGhosts);
    $('showDetours').addEventListener('change', drawDetours);
    $('routeFilter').addEventListener('change', drawDetours);
  </script>
</body>
</html>
