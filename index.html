<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TTC Stop Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <style>
    :root {
      --bus: #da251d;
      --streetcar: #0a7d3e;
      --both: #7b3fa0;
      --alert: #f08c00;
      --panel-bg: #ffffff;
      --panel-fg: #1d1d1f;
      --muted: #6b6b70;
    }
    @media (prefers-color-scheme: dark) {
      :root { --panel-bg: #1f1f22; --panel-fg: #f2f2f4; --muted: #a1a1a8; }
    }
    html, body { height: 100%; margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background: #e5e3df; }
    #map { position: absolute; inset: 0; }
    #panel {
      position: absolute; top: 12px; left: 56px; z-index: 1000;
      background: var(--panel-bg); color: var(--panel-fg);
      border-radius: 10px; box-shadow: 0 2px 12px rgba(0,0,0,.25);
      padding: 12px 14px; width: 260px; max-width: calc(100vw - 88px); font-size: 14px;
    }
    #panel h1 { font-size: 16px; margin: 0; }
    #panelToggle { all: unset; box-sizing: border-box; width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 8px; cursor: pointer; padding: 2px 0; }
    #panelToggle:focus-visible { outline: 2px solid var(--bus); outline-offset: 3px; border-radius: 4px; }
    #panelToggle .chev { width: 8px; height: 8px; border-right: 2px solid currentColor; border-bottom: 2px solid currentColor; transform: rotate(-135deg) translate(-2px, -2px); transition: transform .15s; flex: none; }
    #panel.collapsed #panelToggle .chev { transform: rotate(45deg) translate(-2px, -2px); }
    #panelBody { margin-top: 8px; }
    #panel.collapsed #panelBody { display: none; }
    #panel.collapsed { padding-block: 9px; }
    #panel.collapsed #status, #panel.collapsed #alertStatus { margin-top: 4px; }
    @media (prefers-reduced-motion: reduce) { #panelToggle .chev { transition: none; } }
    #panel label { display: flex; align-items: center; gap: 6px; margin: 4px 0; cursor: pointer; }
    #panel select, #panel input[type=search] { width: 100%; box-sizing: border-box; margin-top: 6px; padding: 5px 6px; font: inherit; }
    .dash { width: 18px; height: 0; border-top: 4px dashed var(--alert); display: inline-block; }
    .dot { width: 11px; height: 11px; border-radius: 50%; display: inline-block; border: 1.5px solid #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.3); }
    #status { color: var(--muted); margin-top: 8px; font-size: 12.5px; }
    #bar { height: 4px; background: rgba(127,127,127,.25); border-radius: 2px; margin-top: 6px; overflow: hidden; }
    #bar > div { height: 100%; width: 0; background: var(--bus); transition: width .2s; }
    .popup h3 { margin: 0 0 4px; font-size: 14px; }
    .popup .meta { color: #666; font-size: 12px; margin-bottom: 6px; }
    .arrivals { margin-top: 8px; border-top: 1px solid #ddd; padding-top: 6px; min-width: 220px; }
    .arrivals .row { display: flex; align-items: baseline; gap: 8px; margin: 5px 0; }
    .arrivals .row .chip { flex: none; }
    .arrivals .dir { font-size: 12px; color: #444; line-height: 1.3; }
    .arrivals .times { font-weight: 700; font-size: 13px; font-variant-numeric: tabular-nums; }
    .arrivals .none { color: #888; font-size: 12px; }
    .arrivals .times { display: flex; flex-wrap: wrap; gap: 2px 14px; }
    .crowd-key { color: #888; font-size: 11px; margin-top: 2px; }
    .arrivals .t { display: inline-flex; flex-direction: column; }
    .crowd { display: inline-flex; align-items: center; gap: 2px; font-size: 10.5px; font-weight: 600; color: #6b6b70; white-space: nowrap; }
    .crowd i { display: inline-block; width: 4px; height: 9px; border-radius: 1px; background: #d4d4d8; }
    .crowd i:last-of-type { margin-right: 3px; }
    .crowd.c1 i:nth-child(1) { background: #2e9e5b; }
    .crowd.c2 i:nth-child(-n+2) { background: #d9a400; }
    .crowd.c3 i, .crowd.c4 i { background: #d4351c; }
    .crowd.c4 { color: #b02a17; }
    .arrivals .updated { color: #888; font-size: 11px; margin-top: 6px; }
    .advisory { margin: 6px 0 8px; padding: 8px 9px; border-radius: 6px; background: #fff4e0; border: 1px solid #f0b54a; color: #4a3000; font-size: 12.5px; line-height: 1.4; }
    .advisory.delay { background: #fffbe6; border-color: #e6cf5a; }
    .advisory.info { background: #eef4fb; border-color: #a9c4e4; color: #12314f; }
    .advisory.upcoming { background: #f3f1f8; border-color: #c4bbdd; color: #2b2340; }
    .advisory.board { background: #eaf6ef; border-color: #8cc8a3; color: #0d3b22; }
    .advisory details { margin-top: 4px; }
    details.folded { margin: 6px 0 8px; font-size: 12.5px; color: #555; }
    details.folded > summary { cursor: pointer; font-weight: 600; padding: 4px 0; }
    details.folded .advisory { margin-top: 6px; }
    .advisory summary { cursor: pointer; font-weight: 600; }
    .advisory .desc { white-space: pre-line; margin-top: 4px; }
    .advisory ul { margin: 4px 0 0; padding-left: 16px; }
    .advisory li { margin: 3px 0; }
    .advisory b { font-weight: 700; }
    .advisory .head { font-weight: 700; margin-bottom: 3px; }
    .advisory .alt { margin-top: 6px; padding-top: 6px; border-top: 1px dashed rgba(0,0,0,.2); }
    .advisory a.go { color: inherit; font-weight: 600; }
    .advisory .src { margin-top: 4px; font-size: 11.5px; opacity: .8; }
    .arrivals .row.bypassed .times { text-decoration: line-through; color: #999; }
    .arrivals .flag { display: inline-block; font-size: 11px; font-weight: 700; color: #a15c00; margin-left: 4px; text-decoration: none; }
    .arrivals .shuttle { display: inline-block; font-size: 11px; font-weight: 700; color: #fff; background: #555; border-radius: 3px; padding: 0 4px; margin-left: 4px; }
    .chip { display: inline-block; padding: 1px 6px; margin: 2px 2px 0 0; border-radius: 4px; color: #fff; font-size: 12px; font-weight: 600; }
    button.chip.off { color: #f4f4f6; text-decoration: line-through; text-decoration-thickness: 1.5px; }
    button.chip { border: 0; font: inherit; font-size: 13px; font-weight: 700; padding: 3px 8px; cursor: pointer; }
    button.chip:focus-visible { outline: 2px solid #1d1d1f; outline-offset: 2px; }
    .popup .hint { color: #888; font-size: 11.5px; margin-top: 3px; }
    .locate-btn { width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; background: #fff; cursor: pointer; border: 0; padding: 0; }
    .locate-btn svg { width: 18px; height: 18px; }
    .locate-btn.busy svg { animation: spin 1s linear infinite; }
    .locate-btn:focus-visible { outline: 2px solid var(--bus); }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .locate-btn.busy svg { animation: none; opacity: .5; } }
    #toast { position: absolute; z-index: 1100; left: 50%; transform: translateX(-50%); bottom: calc(40px + env(safe-area-inset-bottom, 0px));
      background: #1f1f22; color: #fff; padding: 8px 12px; border-radius: 8px; font-size: 13px; max-width: calc(100vw - 40px); box-shadow: 0 2px 10px rgba(0,0,0,.3); }
    #routeCard {
      position: absolute; z-index: 1000; left: max(10px, env(safe-area-inset-left, 0px)); right: max(10px, env(safe-area-inset-right, 0px));
      bottom: calc(26px + env(safe-area-inset-bottom, 0px)); max-width: 420px; margin: 0 auto;
      background: var(--panel-bg); color: var(--panel-fg); border-radius: 10px; box-shadow: 0 2px 12px rgba(0,0,0,.25);
      padding: 10px 12px; font-size: 13px;
    }
    #routeCard .rc-head { display: flex; align-items: center; gap: 8px; }
    #routeCard .rc-head b { flex: 1; min-width: 0; font-size: 14.5px; }
    #rcClose { all: unset; cursor: pointer; font-size: 13px; font-weight: 600; padding: 4px 8px; border-radius: 6px; background: rgba(127,127,127,.18); }
    #rcClose:focus-visible { outline: 2px solid var(--bus); }
    #rcLegend { margin-top: 6px; display: grid; gap: 4px; }
    #rcLegend .it { display: flex; align-items: center; gap: 8px; }
    #rcLegend .sw { flex: none; width: 26px; height: 0; border-top-width: 5px; border-top-style: solid; border-radius: 3px; }
    #rcLegend .note { color: var(--muted); font-size: 12px; }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="toast" hidden></div>
  <div id="routeCard" hidden>
    <div class="rc-head"><span class="chip" id="rcChip"></span><b id="rcTitle"></b><button id="rcClose" type="button">Close</button></div>
    <div id="rcLegend"></div>
  </div>
  <div id="panel">
    <button id="panelToggle" type="button" aria-expanded="true" aria-controls="panelBody">
      <h1>TTC Bus &amp; Streetcar Stops</h1><span class="chev" aria-hidden="true"></span>
    </button>
    <div id="panelBody">
    <label><input type="checkbox" id="showBus" checked> <span class="dot" style="background:var(--bus)"></span> Bus</label>
    <label><input type="checkbox" id="showStreetcar" checked> <span class="dot" style="background:var(--streetcar)"></span> Streetcar</label>
    <label style="color:var(--muted)"><span class="dot" style="background:linear-gradient(90deg, var(--bus) 50%, var(--streetcar) 50%)"></span> Bus and streetcar</label>
    <label style="color:var(--muted)"><span class="dot" style="background:#fff;box-shadow:0 0 0 2.5px var(--alert)"></span> Detour skips this stop</label>
    <label style="color:var(--muted)"><span class="dot" style="background:#fff;border:2px dashed var(--alert);box-shadow:none;width:9px;height:9px"></span> Detour stops here</label>
    <label><input type="checkbox" id="showDetours" checked> <span class="dash"></span> Detour paths (TTC)</label>
    <label style="color:var(--muted)"><span class="dot" style="background:#9a9aa0"></span> Stop not in service</label>
    <select id="routeFilter"><option value="">All routes</option></select>
    <input type="search" id="search" placeholder="Search stop name or number…">
    </div>
    <div id="bar"><div></div></div>
    <div id="status">Loading routes…</div>
    <div id="alertStatus" style="color:var(--muted);font-size:12.5px;margin-top:4px"></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script>
    // Live data from the TTC's public real-time feed (Umo IQ / NextBus).
    const API = 'https://retro.umoiq.com/service/publicJSONFeed?a=ttc';

    // The live feed doesn't say which routes are streetcars. This list comes from
    // the TTC's GTFS schedule (routes.txt, route_type = 0). Update it if routes change.
    const STREETCAR_ROUTES = new Set(['301','303','304','305','306','310','312',
      '501','503','504','505','506','507','508','509','510','511','512']);

    const COLORS = { bus: '#da251d', streetcar: '#0a7d3e', both: '#7b3fa0' };

    const map = L.map('map', { preferCanvas: true, zoomSnap: 0.5 }).setView([43.70, -79.40], 11);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors · Stop data &copy; Toronto Transit Commission'
    }).addTo(map);

    const renderer = L.canvas({ padding: 0.5, tolerance: 6 });

    // A stop marker filled half and half: options.fillColor on the left, options.fillColor2 on
    // the right. Leaflet draws the full circle (fill, outline, tap area); we paint the right half over it.
    const SplitMarker = L.CircleMarker.extend({
      _updatePath() {
        L.CircleMarker.prototype._updatePath.call(this);
        const r = this._renderer;
        if (!r._drawing || this._empty() || !r._ctx) return;
        const ctx = r._ctx, p = this._point, rad = Math.max(Math.round(this._radius), 1) - (this.options.weight || 0) / 2;
        if (rad <= 0) return;
        ctx.save();
        ctx.beginPath();
        ctx.moveTo(p.x, p.y);
        ctx.arc(p.x, p.y, rad, -Math.PI / 2, Math.PI / 2, false);
        ctx.closePath();
        ctx.globalAlpha = this.options.fillOpacity ?? 1;
        ctx.fillStyle = this.options.fillColor2;
        ctx.fill();
        ctx.restore();
      },
    });
    const splitMarker = (ll, opts) => new SplitMarker(ll, opts);   // one canvas for everything, so taps reach every layer
    const networkLayer = L.layerGroup().addTo(map);  // every route, faint
    const highlightLayer = L.layerGroup().addTo(map); // the route the viewer tapped
    const detourLayer = L.layerGroup().addTo(map);   // added first so stops draw on top
    const ghostLayer = L.layerGroup().addTo(map);    // out-of-service stops, under live ones
    const layer = L.layerGroup().addTo(map);
    const stops = new Map();   // key -> { lat, lon, title, stopId, routes: Map(tag -> title) }
    const routeTitles = new Map();
    const routeDirs = new Map(); // route tag -> [{ title, keys: [stop keys in order] }]
    const stopKey = s => s.stopId || s.tag.replace(/_ar$/, '');

    const $ = id => document.getElementById(id);
    const status = msg => { $('status').textContent = msg; };
    const progress = frac => { $('bar').firstElementChild.style.width = (frac * 100).toFixed(1) + '%'; };

    const asArray = x => x == null ? [] : Array.isArray(x) ? x : [x];
    const isStreetcar = tag => STREETCAR_ROUTES.has(tag);

    async function getJSON(params, tries = 3) {
      for (let i = 0; ; i++) {
        try {
          const res = await fetch(`${API}&${params}`);
          if (!res.ok) throw new Error('HTTP ' + res.status);
          const json = await res.json();
          if (json.Error) throw new Error(json.Error.content || 'API error');
          return json;
        } catch (e) {
          if (i >= tries - 1) throw e;
          await new Promise(r => setTimeout(r, 500 * 2 ** i));
        }
      }
    }

    function addRoute(route) {
      const tag = route.tag;
      routeTitles.set(tag, route.title);
      for (const s of asArray(route.stop)) {
        // "_ar" tags are arrival-only duplicates of a terminal stop.
        const key = stopKey(s);
        let stop = stops.get(key);
        if (!stop) {
          stop = { key, lat: +s.lat, lon: +s.lon, title: s.title, stopId: s.stopId, routes: new Map(), tags: new Map() };
          stops.set(key, stop);
        }
        stop.routes.set(tag, route.title);
        stop.tags.set(tag, s.tag);
      }
      const tagToKey = new Map(asArray(route.stop).map(s => [s.tag, stopKey(s)]));
      routeDirs.set(tag, asArray(route.direction).map(d => ({
        title: d.title, keys: asArray(d.stop).map(x => tagToKey.get(x.tag)).filter(Boolean)
      })));
    }

    // Streetcar routes also run replacement buses on their own branches ("506b ... Replacement
    // Bus"), which can stop where streetcars don't. Judge each stop by the branches serving it.
    const modeOf = (route, dir) => isStreetcar(route) && !/\bbus\b/i.test(dir.title) ? 'streetcar' : 'bus';
    // The TTC's branch code from a direction name: "East - 506b Carlton Replacement Bus ..." -> "506B".
    const branchLetter = title => ((String(title).match(/^\w+\s*-\s*\d+([a-z]?)\b/i) || [])[1] || '').toUpperCase();
    const branchCode = (route, title) => route + branchLetter(title);
    const branchCodes = (routes, title) => routes.map(r => r + branchLetter(title)).join(' / ');
    // "506B replacement bus towards Spadina Station" / "506 streetcar towards High Park" / "39A towards Neilson"
    function branchName(routes, title, route = routes[0]) {
      const towards = (String(title).match(/\btowards\s+(.+)$/i) || [])[1];
      const mode = isStreetcar(route) ? (/\bbus\b/i.test(title) ? ' replacement bus' : ' streetcar') : '';
      return branchCodes(routes, title) + mode + (towards ? ' towards ' + towards : '');
    }

    // A streetcar route's replacement-bus branch is shown as a route of its own ("506B"): its own
    // entry in the route list, its own highlight, its own stops. The data stays one TTC route.
    const busBranchDirs = r => isStreetcar(r) ? (routeDirs.get(r) || []).filter(d => modeOf(r, d) === 'bus') : [];
    const busBranches = r => [...new Set(busBranchDirs(r).map(d => branchLetter(d.title)).filter(Boolean))].map(l => r + l);
    function splitRoute(tag) {
      const m = /^(\d+)([A-Z])$/.exec(tag || '');
      if (m && busBranches(m[1]).includes(tag)) return { base: m[1], bus: true, letter: m[2] };
      return { base: tag, bus: false, letter: '' };
    }
    // Is this stop served by that route as shown on the map (506 = the streetcar, 506B = the bus)?
    function stopOnRoute(stop, tag) {
      const { base, bus, letter } = splitRoute(tag);
      if (!stop.routes.has(base)) return false;
      if (!isStreetcar(base)) return true;
      const dirs = (routeDirs.get(base) || []).filter(d => d.keys.includes(stop.key));
      if (!dirs.length) return !bus;
      return dirs.some(d => bus ? modeOf(base, d) === 'bus' && branchLetter(d.title) === letter : modeOf(base, d) === 'streetcar');
    }

    function isStreetcarAt(stop, route) {
      if (!isStreetcar(route)) return false;
      const modes = new Set((routeDirs.get(route) || []).filter(d => d.keys.includes(stop.key)).map(d => modeOf(route, d)));
      return !modes.size || modes.has('streetcar');
    }

    function stopKind(stop, routeSet) {
      let bus = false, car = false;
      for (const tag of routeSet) (isStreetcarAt(stop, tag) ? (car = true) : (bus = true));
      return bus && car ? 'both' : car ? 'streetcar' : 'bus';
    }

    function popupHtml(stop) {
      const tags = [...stop.routes.keys()].sort((a, b) => parseInt(a) - parseInt(b));
      // One chip per branch that stops here, labelled the TTC's way (506, 506B, 39A ...).
      const chips = tags.flatMap(t => {
        const served = (routeDirs.get(t) || []).filter(d => d.keys.includes(stop.key));
        const branches = new Map();
        for (const d of served) branches.set(branchCode(t, d.title), modeOf(t, d));
        // Bus-route branches (39A, 39B) vary by trip and show on each arrival row; one chip is enough.
        if (!isStreetcar(t)) { branches.clear(); branches.set(t, 'bus'); }
        if (!branches.size) branches.set(t, isStreetcar(t) ? 'streetcar' : 'bus');
        // Streetcar not stopping here right now (only its replacement bus): show it greyed out.
        // Its own key, so a replacement bus without a branch letter (503) keeps its chip.
        if (isStreetcar(t) && ![...branches.values()].includes('streetcar')) branches.set(t + '\u0000off', 'off');
        return [...branches].sort((a, b) => { const ka = a[0].split('\u0000')[0], kb = b[0].split('\u0000')[0];
          return ka < kb ? -1 : ka > kb ? 1 : (a[1] === 'off' ? -1 : 1); }).map(([key, mode]) => {
          const code = key.split('\u0000')[0];
          return `<button type="button" class="chip${mode === 'off' ? ' off' : ''}" data-route="${escapeHtml(mode === 'bus' && isStreetcar(t) && code !== t ? code : t)}" style="background:${mode === 'off' ? '#b5b5ba' : mode === 'streetcar' ? COLORS.streetcar : COLORS.bus}" ` +
          `title="${mode === 'off' ? code + ' streetcar isn\'t stopping here right now. ' : mode === 'bus' && isStreetcar(t) ? 'Replacement bus. ' : ''}Show ${escapeHtml(stop.routes.get(t))} on the map">${escapeHtml(code)}</button>`; });
      }).join('');
      return `<div class="popup"><h3>${escapeHtml(stop.title)}</h3>
        <div class="meta">${stop.stopId ? 'Stop #' + stop.stopId : 'No stop number'}${cornerOf(stop) ? ' · ' + escapeHtml(cornerOf(stop, true)) : ''} · ${tags.length} route${tags.length === 1 ? '' : 's'}</div>
        ${chips}<div class="hint">Tap a route to see it on the map</div>
        <div class="arrivals">Checking next arrivals…</div></div>`;
    }

    // Leaflet re-runs the content function whenever the popup updates, so keep one
    // element per stop; arrival times written into it then survive popup.update().
    // Keep popups clear of the filter panel (it covers the top of the map on phones).
    function popupOptions() {
      const panel = $('panel').getBoundingClientRect();
      return { maxWidth: 300, maxHeight: Math.round(window.innerHeight * 0.55), autoPanPaddingTopLeft: L.point(10, panel.bottom + 10), autoPanPaddingBottomRight: L.point(10, 30) };
    }

    function popupEl(stop) {
      if (!stop.el) {
        stop.el = document.createElement('div');
        stop.el.innerHTML = popupHtml(stop);
      }
      return stop.el;
    }

    // ---- Service alerts & detours ---------------------------------------------
    // TTC alerts (alerts.ttc.ca) list the stop numbers each detour or closure skips.
    // The TTC doesn't allow browsers to read that feed directly, so server.js relays it.
    const ALERTS_URL = 'api/alerts';
    const BYPASS = new Set(['DETOUR', 'NO_SERVICE', 'REDUCED_SERVICE', 'STOP_MOVED', 'MODIFIED_SERVICE']);
    let alerts = [], alertsOk = null, affectedKeys = new Set(), alertRetries = 0, alertSig = null;

    // alerts.ttc.ca marks "no end" as year 0001; GTFS-realtime alerts may have several periods.
    const periodsOf = a => (a.activePeriods?.length ? a.activePeriods : [a.activePeriod || {}]).map(p => ({
      start: p.start ? Date.parse(p.start) : -Infinity,
      end: !p.end || p.end.startsWith('0001') ? Infinity : Date.parse(p.end),
    }));
    const UPCOMING_MS = 14 * 24 * 3600 * 1000;   // also show planned changes starting in the next two weeks
    function timing(a, now = Date.now()) {
      const ps = periodsOf(a);
      if (ps.some(p => p.start <= now && now < p.end)) return { state: 'active' };
      const next = ps.filter(p => p.start > now && p.start - now < UPCOMING_MS).sort((x, y) => x.start - y.start)[0];
      return next ? { state: 'upcoming', ...next } : { state: 'inactive' };
    }

    async function loadAlerts() {
      try {
        const res = await fetch(ALERTS_URL, { cache: 'no-store' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const json = await res.json();
        alerts = asArray(json.routes)
          .map(a => ({ ...a, timing: timing(a) }))
          .filter(a => a.effect && a.effect !== 'NO_EFFECT' && a.timing.state !== 'inactive')
          // An upcoming alert never means "not stopping here" yet.
          .map(a => ({ ...a, upcoming: a.timing.state === 'upcoming', stopSet: new Set(asArray(a.stops).map(String)) }));
        alertsOk = true;
        // New, changed or ended alerts: the server rebuilds those routes' lines; fetch them.
        const sig = alerts.filter(a => !a.upcoming).map(a => a.route + ':' + a.id).sort().join(',');
        if (alertSig !== null && sig !== alertSig) loadNetwork();
        alertSig = sig;
        if (alertRetries) { alertRetries = 0; loadGhosts(); }      // back after a failure: refresh what depends on alerts
      } catch (e) {
        alertsOk = false;
        // A failed load (often the server restarting for an update) shouldn't last until the next
        // regular refresh: retry soon, backing off.
        if (alertRetries < 6) setTimeout(loadAlerts, 5000 * 2 ** alertRetries++);
      }
      const surface = alerts.filter(a => !a.upcoming && (routeTitles.has(a.route) || !routeTitles.size));
      const routesHit = new Set(surface.map(a => a.route)).size;
      const upcoming = new Set(alerts.filter(a => a.upcoming && routeTitles.has(a.route)).map(a => a.route)).size;
      const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;
      $('alertStatus').textContent = alertsOk
        ? `Service changes or alerts on ${plural(routesHit, 'route')} now` + (upcoming ? ` · ${upcoming} more planned soon` : '')
        : 'Couldn\'t load TTC service alerts; retrying…';

      const next = new Set();
      for (const [key, stop] of stops) if (stopDisruptions(stop).some(d => d.bypass)) next.add(key);
      const changed = next.size !== affectedKeys.size || [...next].some(k => !affectedKeys.has(k));
      affectedKeys = next;
      // Redraw only when something changed and no popup is open (redrawing closes it).
      if (changed && stops.size && !map._popup?.isOpen()) updateStatus();
    }

    const dirWord = s => (String(s).match(/\b(north|south|east|west)/i) || [])[1]?.toLowerCase();
    function dirMatches(alertDir, dirTitle) {
      const a = dirWord(alertDir);
      return !a || /both/i.test(alertDir) || dirWord(dirTitle) === a;
    }

    // Every active alert touching this stop, per route.
    function stopDisruptions(stop) {
      const out = [];
      for (const a of alerts) {
        if (!stop.routes.has(a.route)) continue;
        const hitsStop = stop.stopId && a.stopSet.has(stop.stopId);
        if (!hitsStop && a.stopSet.size) continue;             // alert is about other stops on this route
        out.push({ alert: a, route: a.route, bypass: hitsStop && !a.upcoming && BYPASS.has(a.effect), routeWide: !a.stopSet.size });
      }
      // Most urgent first: skipped here, then current changes, then upcoming ones.
      const rank = d => d.bypass ? 0 : d.alert.upcoming ? 2 : 1;
      return out.sort((x, y) => rank(x) - rank(y));
    }

    function metres(a, b) {
      const R = 6371000, rad = Math.PI / 180;
      const dLat = (b.lat - a.lat) * rad, dLon = (b.lon - a.lon) * rad;
      const h = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * rad) * Math.cos(b.lat * rad) * Math.sin(dLon / 2) ** 2;
      return 2 * R * Math.asin(Math.sqrt(h));
    }
    const walk = m => `${m < 1000 ? Math.round(m / 10) * 10 + ' m' : (m / 1000).toFixed(1) + ' km'}, about ${Math.max(1, Math.round(m / 80))} min walk`;

    // Nearest stop on the same route and direction that the alert doesn't skip.
    function nearestRegularStop(stop, d) {
      const key = stopKey({ stopId: stop.stopId, tag: stop.tags.get(d.route) || '' });
      let best = null;
      for (const dir of routeDirs.get(d.route) || []) {
        if (!dir.keys.includes(key) || !dirMatches(d.alert.direction, dir.title)) continue;
        for (const k of dir.keys) {
          const s = stops.get(k);
          if (!s || s === stop || (s.stopId && d.alert.stopSet.has(s.stopId))) continue;
          const m = metres(stop, s);
          if (!best || m < best.m) best = { stop: s, m };
        }
      }
      return best;
    }

    // The TTC's detour path for this route (trip modifications feed): the stop nearest the
    // tapped one where vehicles travel the same way as the detour, so a southbound stop is never
    // offered for a bus detouring north.
    // Distance from p to segment a-b, and how far along the segment p's closest point is (0..1).
    function segProj(p, a, b) {
      const ax = (a.lon - p.lon) * M_LON, ay = (a.lat - p.lat) * M_LAT, bx = (b.lon - p.lon) * M_LON, by = (b.lat - p.lat) * M_LAT;
      const dx = bx - ax, dy = by - ay, L2 = dx * dx + dy * dy, t = L2 ? Math.max(0, Math.min(1, -(ax * dx + ay * dy) / L2)) : 0;
      return { m: Math.hypot(ax + t * dx, ay + t * dy), t };
    }
    function detourPathStop(stop, d) {
      let best = null;
      for (const det of detours.filter(x => x.route === d.route)) {
        const path = det.path.map(([lat, lon]) => ({ lat, lon }));
        const box = path.reduce((b, p) => [Math.min(b[0], p.lat), Math.max(b[1], p.lat), Math.min(b[2], p.lon), Math.max(b[3], p.lon)], [90, -90, 180, -180]);
        for (const s of stops.values()) {
          if (s === stop || (s.stopId && d.alert.stopSet.has(s.stopId))) continue;
          if (s.lat < box[0] - 0.0003 || s.lat > box[1] + 0.0003 || s.lon < box[2] - 0.0004 || s.lon > box[3] + 0.0004) continue;
          // Nearest point on the path, and how far along the detour it is.
          let nm = Infinity, head = null, along = 0, run = 0;
          for (let i = 1; i < path.length; i++) {
            const len = metres(path[i - 1], path[i]), pr = segProj(s, path[i - 1], path[i]);
            if (pr.m < nm) { nm = pr.m; head = cardOf(bearing(path[i - 1], path[i])); along = run + pr.t * len; }
            run += len;
          }
          if (nm > 25) continue;
          // Past the turn onto the detour: a stop just before it (Don Mills south of York Mills, for
          // a bus turning left from York Mills) can't be reached.
          if (along < 25) continue;
          cornerOf(s);
          if (s.travel !== head) continue;                       // other side of the street
          const m = metres(stop, s);
          if (!best || m < best.m) best = { stop: s, m };
        }
      }
      return best;
    }

    // The last stop before the skipped stretch and the first one after it, in this direction.
    function detourEnds(stop, d) {
      const out = {};
      for (const dir of routeDirs.get(d.route) || []) {
        if (!dir.keys.includes(stop.key) || !dirMatches(d.alert.direction, dir.title)) continue;
        const skipped = dir.keys.map(k => { const s = stops.get(k); return !!(s?.stopId && d.alert.stopSet.has(s.stopId)); });
        const first = skipped.indexOf(true), last = skipped.lastIndexOf(true);
        if (first < 0) continue;
        const pick = i => { const s = stops.get(dir.keys[i]); return s && { stop: s, m: metres(stop, s) }; };
        if (first > 0 && !out.before) out.before = pick(first - 1);
        if (last + 1 < dir.keys.length && !out.after) out.after = pick(last + 1);
      }
      return out;
    }

    // Street names a detour runs on, from text like "Detour via Church St, Maitland St and Jarvis St".
    const SUFFIX = /\b(st|street|ave|avenue|rd|road|blvd|boulevard|dr|drive|cres|crescent|crt|court|pkwy|parkway|hwy|ln|lane|way|cir|circle|trl|trail|gate|gdns|pl|place|sq|e|w|n|s|east|west|north|south)\b\.?/g;
    const streetKey = name => name.toLowerCase().replace(/[.']/g, '').replace(SUFFIX, ' ').replace(/\s+/g, ' ').trim();
    function detourStreets(text) {
      const out = new Set();
      const grab = re => { const m = text.match(re); if (m) m[1].split(/,\s*|\s+and\s+|\s*&\s*/i).forEach(n => { const k = streetKey(n); if (k) out.add(k); }); };
      grab(/\bvia\s+(.+?)(?:\s+(?:due to|between|from|until|while|because)\b|[.;]|$)/i);
      grab(/\b(?:running|operating|diverting|divert)\s+(?:on|along)\s+(.+?)(?:\s+(?:due to|between|from|until|while)\b|[.;]|$)/i);
      return out;
    }

    // Closest existing stop on one of the detour streets (detoured vehicles use stops along the detour).
    function nearestDetourStop(stop, d) {
      const streets = detourStreets(`${d.alert.title || ''} ${d.alert.headerText || ''} ${d.alert.description || ''}`);
      if (!streets.size) return null;
      let best = null;
      for (const s of stops.values()) {
        if (s === stop || (s.stopId && d.alert.stopSet.has(s.stopId))) continue;
        const m = metres(stop, s);
        if (m > 2000 || (best && m >= best.m)) continue;
        const street = streetKey(s.title.split(/\s+at\s+/i)[0]);
        if (streets.has(street)) best = { stop: s, m, street };
      }
      return best;
    }

    const stopLink = s => `<a class="go" href="#" data-goto="${escapeHtml(stopKeyOf(s))}">${escapeHtml(s.title)}</a>${s.stopId ? ' (#' + s.stopId + ')' : ''}` +
      (cornerOf(s) ? `, <b>${escapeHtml(cornerOf(s))}</b>` : '');

    // ---- Which corner is a stop on? -----------------------------------------
    // Stops on opposite corners often share a name ("Bay St at College St"). The corner follows
    // from the direction vehicles travel through the stop (they stop on the right-hand side)
    // and whether the stop is before or after the cross street, judged against the middle of
    // all the stops at that intersection.
    const M_LAT = 110574, M_LON = 80487;
    const CARD = ['north', 'east', 'south', 'west'];
    const cardOf = deg => CARD[Math.round((((deg % 360) + 360) % 360) / 90) % 4];
    const bearing = (a, b) => (Math.atan2((b.lon - a.lon) * M_LON, (b.lat - a.lat) * M_LAT) * 180 / Math.PI + 360) % 360;
    const UNIT = { north: [0, 1], east: [1, 0], south: [0, -1], west: [-1, 0] };
    const RIGHT_OF = { north: 'east', east: 'south', south: 'west', west: 'north' };
    const OPPOSITE = { north: 'south', south: 'north', east: 'west', west: 'east' };

    function splitTitle(t) {
      const [main, cross] = t.split(/\s+at\s+/i);
      return { main: (main || '').trim(), cross: (cross || '').replace(/\s+-\s+.*$/, '').replace(/\s+(north|south|east|west)\s+side$/i, '').trim() };
    }

    // Direction of travel arriving at the stop, from the stop before it on any route.
    function travelDir(stop) {
      for (const route of stop.routes.keys()) for (const d of routeDirs.get(route) || []) {
        const i = d.keys.indexOf(stop.key);
        if (i < 0) continue;
        const prev = i > 0 && stops.get(d.keys[i - 1]), next = i + 1 < d.keys.length && stops.get(d.keys[i + 1]);
        if (prev && metres(prev, stop) > 15) return cardOf(bearing(prev, stop));
        if (next && metres(stop, next) > 15) return cardOf(bearing(stop, next));
      }
      return null;
    }

    function intersectionCentre(stop, main, cross) {
      const a = streetKey(main), b = streetKey(cross);
      if (!a || !b) return null;
      let n = 0, latMin = 90, latMax = -90, lonMin = 180, lonMax = -180;
      for (const s of stops.values()) {
        if (Math.abs(s.lat - stop.lat) > 0.0012 || Math.abs(s.lon - stop.lon) > 0.0016) continue;   // ~130 m box
        const t = splitTitle(s.title), x = streetKey(t.main), y = streetKey(t.cross);
        if (!((x === a && y === b) || (x === b && y === a))) continue;
        n++; latMin = Math.min(latMin, s.lat); latMax = Math.max(latMax, s.lat); lonMin = Math.min(lonMin, s.lon); lonMax = Math.max(lonMax, s.lon);
      }
      return n >= 2 ? { lat: (latMin + latMax) / 2, lon: (lonMin + lonMax) / 2 } : null;
    }

    // "southeast corner" (or "east side" mid-block); withTravel adds "northbound".
    function cornerOf(stop, withTravel = false) {
      if (stop.corner === undefined) {
        const dir = travelDir(stop);
        let label = null;
        if (dir) {
          const side = RIGHT_OF[dir];
          const { main, cross } = splitTitle(stop.title);
          const c = cross && intersectionCentre(stop, main, cross);
          label = side + ' side';
          if (c) {
            const [ux, uy] = UNIT[dir];
            const along = (stop.lon - c.lon) * M_LON * ux + (stop.lat - c.lat) * M_LAT * uy;
            if (Math.abs(along) >= 6) {
              const pos = along < 0 ? OPPOSITE[dir] : dir;                // before the cross street, or past it
              const ns = [pos, side].find(x => x === 'north' || x === 'south');
              const ew = [pos, side].find(x => x === 'east' || x === 'west');
              if (ns && ew) label = ns + ew + ' corner';
            }
          }
        }
        stop.corner = label;
        stop.travel = dir;
      }
      if (!stop.corner) return '';
      return withTravel && stop.travel ? `${stop.corner}, ${stop.travel}bound` : stop.corner;
    }
    const stopKeyOf = s => s.key;
    const SHUTTLE_RE = /shuttle|replacement bus|buses are (running|replacing)|bus(es)? replac/i;

    function advisoryHtml(stop, disruptions) {
      if (alertsOk === false) return `<div class="advisory info">Detour info is unavailable right now, so these times can't be checked against TTC service alerts.</div>`;
      // The same TTC alert often covers several routes (306 and 506): show it once.
      const seen = new Map();
      for (const d of disruptions) {
        const k = d.bypass ? d.route + '|' + d.alert.id : 'a|' + d.alert.id + '|' + d.alert.source;
        if (seen.has(k)) seen.get(k).routes.push(d.route); else seen.set(k, { ...d, routes: [d.route] });
      }
      const shown = [], folded = [];
      for (const d of seen.values()) (d.bypass || alertRelevant(stop, d.alert) ? shown : folded).push(d);
      const render = d => {
        const a = d.alert, rt = escapeHtml(d.routes.join(' / '));
        const text = escapeHtml(a.headerText || a.title || '');
        const dirNote = a.direction && !/both/i.test(a.direction) ? ` ${escapeHtml(a.direction.toLowerCase())}` : '';
        if (!d.bypass) {
          const cls = a.upcoming ? 'upcoming' : a.effect === 'SIGNIFICANT_DELAYS' ? 'delay' : 'info';
          const head = a.upcoming ? `${rt}: planned change ${escapeHtml(whenText(a.timing))}`
            : `${rt}: ${escapeHtml(a.effectDesc || 'Service alert')}${d.routeWide ? ' on this route' : ' at this stop'}`;
          const summary = escapeHtml(cleanHeader(a.headerText || a.title || '', d.route));
          const desc = a.description && a.description !== a.headerText ? a.description : '';
          return `<div class="advisory ${cls}"><div class="head">${head}</div>${summary}` +
            (desc ? `<details${a.upcoming ? '' : ' open'}><summary>Details</summary><div class="desc">${escapeHtml(desc)}</div></details>` : '') +
            (a.url ? `<div class="src"><a class="go" href="${escapeHtml(a.url)}" target="_blank" rel="noopener">TTC advisory</a></div>` : '') +
            `</div>`;
        }
        let html = `<div class="advisory"><div class="head">${rt}${dirNote} is not stopping here</div>${text}`;
        // Where to catch it instead: on the detour (the TTC's own detour path when it has one,
        // stops where traffic goes the detour's way), before the skipped stretch, or after it.
        const ends = detourEnds(stop, d);
        // Best: the TTC's own list of stops the detoured trips serve.
        const myDir = (routeDirs.get(d.route) || []).find(x => x.keys.includes(stop.key) && dirMatches(d.alert.direction, x.title));
        const trip = detourTripFor(d.route, myDir?.title);
        const listed = trip ? trip.detourStops.map(id => [...stops.values()].find(s => s.stopId === id)).filter(Boolean) : [];
        if (listed.length) {
          const first = listed[0];
          html += `<div class="alt">First stop on the detour route: ${stopLink(first)}, ${walk(metres(stop, first))}` +
            `${trip.times[first.stopId]?.length ? ' · next ' + trip.times[first.stopId].map(minsFrom).join(', ') : ''}.</div>`;
          if (listed.length > 1) html += `<div class="alt">Detour stops, in order: ${listed.map(s => escapeHtml(s.title) + (s.stopId ? ' (#' + s.stopId + ')' : '')).join(' → ')}</div>`;
          html += `<div class="src">Stops from the TTC's trip data for detoured ${rt} buses</div>`;
        }
        const onPath = listed.length ? null : detourPathStop(stop, d);
        const detour = listed.length ? null : onPath || nearestDetourStop(stop, d);
        if (detour)
          html += `<div class="alt">${onPath ? 'First stop on the detour route' : 'Closest stop on the detour streets'}: ${stopLink(detour.stop)}, ${walk(detour.m)}.` +
                  `${onPath ? '' : ' <span class="src">(from the alert text; check the direction)</span>'}</div>`;
        if (ends.before) html += `<div class="alt">Or catch it before the detour: ${stopLink(ends.before.stop)}, ${walk(ends.before.m)}.</div>`;
        if (ends.after) html += `<div class="alt">It's back on its regular route from ${stopLink(ends.after.stop)}, ${walk(ends.after.m)}.</div>`;
        if (!detour && !ends.before && !ends.after) {
          const regular = nearestRegularStop(stop, d);
          if (regular) html += `<div class="alt">Nearest stop where ${rt} still stops normally: ${stopLink(regular.stop)}, ${walk(regular.m)}.</div>`;
        }
        if (a.shuttleType || SHUTTLE_RE.test(`${a.title} ${a.headerText} ${a.description}`))
          html += `<div class="alt"><b>Replacement buses:</b> ${escapeHtml(a.shuttleType && !/^running$/i.test(a.shuttleType) ? a.shuttleType : 'the TTC says shuttle buses are running')}` +
                  `${a.shuttleStart ? ' from ' + escapeHtml(a.shuttleStart) : ''}${a.shuttleEnd ? ' to ' + escapeHtml(a.shuttleEnd) : ''}.</div>`;
        html += `<div class="src">Source: TTC service alerts</div></div>`;
        return html;
      };
      // Updates that don't mention this stop, its streets or its direction: one tap away.
      return shown.map(render).join('') + (folded.length
        ? `<details class="folded"><summary>${folded.length} other update${folded.length === 1 ? '' : 's'} for ${folded.length === 1 ? 'this route' : 'these routes'}</summary>${folded.map(render).join('')}</details>`
        : '');
    }

    // Does a route-wide TTC notice concern this stop? It does if it names the stop, names one of
    // the stop's streets ("... via College Street between Yonge Street and Bay Street"), and isn't
    // limited to the other direction.
    const reEscape = t => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    function alertRelevant(stop, a) {
      if (stop.stopId && a.stopSet?.has(stop.stopId)) return true;
      const only = a.direction && !/both/i.test(a.direction) ? dirWord(a.direction) : null;
      if (!stop.ghost) cornerOf(stop);                      // sets stop.travel
      if (only && stop.travel && only !== stop.travel) return false;
      const text = ' ' + streetKey(`${a.title || ''} ${a.headerText || ''} ${a.description || ''}`.replace(/[/,;:()–—-]/g, ' ')) + ' ';
      const { main, cross } = splitTitle(stop.title);
      return [main, cross].map(streetKey).filter(n => n.length >= 3).some(n => new RegExp(`\\b${reEscape(n)}\\b`).test(text));
    }

    // TTC headers sometimes start with a dash or repeat the route ("506 Carlton – ...").
    const cleanHeader = (t, route) => t.replace(/^\s*[–—-]\s*/, '').trim();
    const TZ = { timeZone: 'America/Toronto' };
    function whenText(t) {
      const day = new Date(t.start).toLocaleDateString('en-CA', { ...TZ, weekday: 'short', month: 'short', day: 'numeric' });
      const time = ms => new Date(ms).toLocaleTimeString('en-CA', { ...TZ, hour: 'numeric', minute: '2-digit' });
      return `starting ${day}, ${time(t.start)}` + (Number.isFinite(t.end) ? ` until ${new Date(t.end).toLocaleDateString('en-CA', { ...TZ, month: 'short', day: 'numeric' }) === new Date(t.start).toLocaleDateString('en-CA', { ...TZ, month: 'short', day: 'numeric' }) ? time(t.end) : new Date(t.end).toLocaleDateString('en-CA', { ...TZ, weekday: 'short', month: 'short', day: 'numeric' })}` : '');
    }

    // ---- "Does my direction stop here?" -------------------------------------
    // Each side of the street is its own stop, so a stop normally serves one direction and the
    // opposite direction stops across the street. If a route has no stop for some direction
    // anywhere near this corner (a detour, a one-way street, a replacement bus on another road),
    // say so and list where that direction can be boarded instead.
    const NEARBY_M = 120, ALT_MAX_M = 1500;
    const DIR_NAME = { north: 'Northbound', south: 'Southbound', east: 'Eastbound', west: 'Westbound' };

    function missingDirections(stop) {
      const out = [];
      for (const route of stop.routes.keys()) {
        // Only when the TTC reports a change on this route now; otherwise loops, terminals and
        // one-way streets would trigger it on normal days.
        if (!alerts.some(a => a.route === route && !a.upcoming)) continue;
        const dirs = routeDirs.get(route) || [];
        // A route's first or last stop has no opposite direction by nature.
        if (dirs.some(d => d.keys[0] === stop.key || d.keys[d.keys.length - 1] === stop.key)) continue;
        // Direction and mode together: an eastbound replacement bus stopping here doesn't mean
        // the eastbound streetcar does.
        const wm = d => dirWord(d.title) && dirWord(d.title) + '|' + modeOf(route, d);
        const served = dirs.filter(d => d.keys.includes(stop.key));
        const here = new Set(served.map(wm)), hereWords = new Set(served.map(d => dirWord(d.title)));
        const found = [];
        for (const key of new Set(dirs.map(wm).filter(Boolean))) {
          if (here.has(key)) continue;
          const [w, mode] = key.split('|');
          const opts = [];
          for (const d of dirs.filter(d => wm(d) === key)) {
            let best = null;
            for (const k of d.keys) {
              const s = stops.get(k);
              if (!s) continue;
              const m = metres(stop, s);
              if (!best || m < best.m) best = { stop: s, m };
            }
            if (best) opts.push({ dir: d, ...best });
          }
          if (!opts.length) continue;
          const nearby = opts.some(o => o.m <= NEARBY_M);                   // boards across the street: normal
          found.push({ route, word: w, mode, nearby, partial: hereWords.has(w),
                       opts: opts.filter(o => o.m <= ALT_MAX_M).sort((a, b) => a.m - b.m) });
        }
        // A streetcar going that way here or across the street covers it; a replacement bus on
        // another street isn't news.
        const carCovers = w => hereWords.has(w) && here.has(w + '|streetcar') ||
          found.some(f => f.word === w && f.mode === 'streetcar' && f.nearby);
        for (const f of found) {
          if (f.nearby || !f.opts.length) continue;
          if (f.mode === 'bus' && carCovers(f.word)) continue;
          out.push(f);
        }
      }
      return out;
    }

    // An out-of-service stop nearby that stands for this route and direction.
    const ghostFor = (stop, route, word) => ghosts.find(g => g !== stop && metres(g, stop) < 120 && g.missing.some(m => m.route === route && m.word === word));

    function boardingHtml(stop) {
      // A stop serves one direction, so its popup is about that direction. The other direction
      // shows only if no out-of-service stop on the other side carries it ("Going westbound?").
      // The other direction often stops on a far corner across a wide intersection (King &
      // Spadina, ~120 m): only worth a note when none of its stops is within 200 m.
      const list = stop.ghost ? stop.missing : missingDirections(stop)
        .filter(x => x.partial || (!ghostFor(stop, x.route, x.word) && x.opts[0].m > 200));
      // Routes sharing the same alternatives (e.g. 306 and 506) get one box.
      const merged = new Map();
      for (const x of list) {
        const k = x.route + '|' + x.word + '|' + x.partial;
        if (!merged.has(k)) merged.set(k, { ...x, opts: [...x.opts] });
        else { const m = merged.get(k); m.mode = m.mode === x.mode ? m.mode : 'any'; m.opts.push(...x.opts); m.opts.sort((a, b) => a.m - b.m); }
      }
      const groups = new Map();
      for (const x of merged.values()) {
        const sig = x.word + '|' + x.mode + '|' + x.partial + '|' + x.opts.map(o => o.stop.key).join(',');
        if (!groups.has(sig)) groups.set(sig, { ...x, routes: [] });
        groups.get(sig).routes.push(x.route);
      }
      return [...groups.values()].sort((a, b) => b.partial - a.partial).map(x => {
        const items = x.opts.map(o => {
          const name = branchName(x.routes, o.dir.title, x.route), kind = '';
          return `<li><b>${escapeHtml(name)}${kind}</b>: ${stopLink(o.stop)}, ${walk(o.m)}</li>`;
        }).join('');
        const what = isStreetcar(x.route) && x.mode !== 'any' ? (x.mode === 'streetcar' ? ' streetcar' : ' replacement bus') : '';
        const label = x.mode === 'bus' && isStreetcar(x.route) ? branchCodes(x.routes, x.opts[0].dir.title) : x.routes.join(' / ');
        const servedBus = (routeDirs.get(x.route) || []).find(d => d.keys.includes(stop.key) && modeOf(x.route, d) === 'bus');
        const other = !x.partial ? '' : x.mode === 'streetcar'
          ? `Only the ${servedBus ? branchCodes(x.routes, servedBus.title) + ' ' : ''}replacement bus stops here going this way. `
          : 'Only the streetcar stops here going this way. ';
        const ask = !stop.ghost && !x.partial ? `Going ${DIR_NAME[x.word].toLowerCase()}? ` : '';
        return `<div class="advisory board"><div class="head">${ask}${DIR_NAME[x.word]} ${escapeHtml(label)}${what} doesn't stop at this corner right now</div>` +
          `${other}Board ${what ? 'the ' + DIR_NAME[x.word].toLowerCase() + what : DIR_NAME[x.word].toLowerCase()} at:<ul>${items}</ul></div>`;
      }).join('');
    }

    // ---- Detour stops (TTC GTFS-realtime trip updates for detoured trips, via server.js) -------
    // The stops detoured trips actually serve, in order, with predicted times; detourStops are
    // the ones the route doesn't normally serve.
    let detourTrips = [], detourStopIndex = new Map();
    async function loadDetourStops() {
      try {
        const res = await fetch('api/detour-stops', { cache: 'no-store' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        detourTrips = (await res.json()).detours || [];
      } catch { return; }
      const next = new Map();
      for (const d of detourTrips) for (const id of d.detourStops) {
        if (!next.has(id)) next.set(id, []);
        next.get(id).push(d);
      }
      const changed = next.size !== detourStopIndex.size || [...next.keys()].some(k => !detourStopIndex.has(k));
      detourStopIndex = next;
      if (changed && stops.size && !map._popup?.isOpen()) updateStatus();
      refreshArrivals?.();
    }
    // The detour (if the TTC lists one) for this route in this stop's direction ("towards ...").
    function detourTripFor(route, dirTitle) {
      const list = detourTrips.filter(d => d.route === route);
      return list.find(d => dirTitle && d.headsign && dirTitle.toLowerCase().includes(d.headsign.toLowerCase())) || (list.length === 1 ? list[0] : null);
    }
    // ---- How full each vehicle is (TTC GTFS-realtime vehicle positions, via server.js) -------
    let occupancy = {};
    async function loadOccupancy() {
      try {
        const res = await fetch('api/occupancy', { cache: 'no-store' });
        if (res.ok) occupancy = (await res.json()).vehicles || {};
      } catch { /* times still show without it */ }
    }
    const CROWD = {
      EMPTY: ['Lots of seats', 1], MANY_SEATS_AVAILABLE: ['Lots of seats', 1], FEW_SEATS_AVAILABLE: ['Few seats', 2],
      STANDING_ROOM_ONLY: ['Standing', 3], CRUSHED_STANDING_ROOM_ONLY: ['Very crowded', 4], FULL: ['Full', 4],
      NOT_ACCEPTING_PASSENGERS: ['Not boarding', 4],
    };
    function crowdTag(vehicle) {
      const c = CROWD[occupancy[vehicle]];
      if (!c) return '';
      // Bars always; words only once it's filling up, so a quiet stop stays compact.
      return `<span class="crowd c${c[1]}" title="${c[0]}" aria-label="${c[0]}"><i></i><i></i><i></i>${c[1] >= 2 ? c[0] : ''}</span>`;
    }

    const minsFrom = t => { const m = Math.round((t - Date.now()) / 60000); return m <= 0 ? 'Due' : m + ' min'; };

    // ---- Detour paths (TTC GTFS-realtime trip modifications, via server.js) ----------------
    let detours = [];
    const torontoYmd = () => new Date().toLocaleDateString('en-CA', { timeZone: 'America/Toronto' }).replace(/-/g, '');
    const ymdText = d => new Date(+d.slice(0, 4), +d.slice(4, 6) - 1, +d.slice(6)).toLocaleDateString('en-CA', { weekday: 'short', month: 'short', day: 'numeric' });

    async function loadDetours() {
      try {
        const res = await fetch('api/detours', { cache: 'no-store' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        detours = (await res.json()).detours || [];
      } catch { detours = []; }
      drawDetours();
    }

    function drawDetours() {
      detourLayer.clearLayers();
      if (!$('showDetours').checked) return;
      const routeTag = $('routeFilter').value, today = torontoYmd();
      for (const d of detours) {
        if (routeTag && d.route !== splitRoute(routeTag).base) continue;
        const running = d.serviceDates.includes(today);
        const dates = d.serviceDates.length ? `${ymdText(d.serviceDates[0])} to ${ymdText(d.serviceDates[d.serviceDates.length - 1])}` : '';
        L.polyline(d.path, { renderer, color: running ? '#f08c00' : '#8a6fc0', weight: 5, opacity: 0.9, dashArray: '10 7', lineCap: 'round' })
          .bindPopup(`<div class="popup"><h3>${escapeHtml(d.route)} detour</h3>
            <div class="meta">Towards ${escapeHtml(d.headsigns.join(', '))}</div>
            ${running ? 'Running today' : 'Planned'}${dates ? ' · ' + escapeHtml(dates) : ''}<br>
            <span class="meta">Path from the TTC's detour feed. The dashed line is where vehicles leave the regular route.</span></div>`)
          .addTo(detourLayer);
      }
      restack();
    }

    function detourNoteHtml(stop) {
      const routes = [...stop.routes.keys()].filter(r => detours.some(d => d.route === r));
      if (!routes.length) return '';
      return `<div class="advisory info"><b>${escapeHtml(routes.join(' / '))}</b> ${routes.length === 1 ? 'has' : 'have'} a detour path from the TTC. ` +
        routes.map(r => `<a class="go" href="#" data-detour="${escapeHtml(r)}">Show ${escapeHtml(r)} detour</a>`).join(' · ') + `</div>`;
    }

    document.addEventListener('click', e => {
      const a = e.target.closest('a[data-detour]');
      if (!a) return;
      e.preventDefault();
      const pts = detours.filter(d => d.route === a.dataset.detour).flatMap(d => d.path);
      if (!pts.length) return;
      if (!$('showDetours').checked) { $('showDetours').checked = true; drawDetours(); }
      map.closePopup();
      map.fitBounds(pts, { padding: [60, 60], maxZoom: 17 });
    });

    // ---- Route lines --------------------------------------------------------------------
    // Every route is drawn faintly (from the TTC schedule, via server.js). Tapping a route —
    // a line, a route chip in a stop popup, or the route list — highlights its live path and
    // marks where it differs from the regular route.
    const decodeLine = str => {
      const out = []; let i = 0, lat = 0, lon = 0;
      while (i < str.length) {
        for (let k = 0; k < 2; k++) {
          let shift = 0, res = 0, b;
          do { b = str.charCodeAt(i++) - 63; res |= (b & 0x1f) << shift; shift += 5; } while (b >= 0x20);
          const v = res & 1 ? ~(res >> 1) : res >> 1;
          if (k === 0) lat += v; else lon += v;
        }
        out.push([lat / 1e5, lon / 1e5]);
      }
      return out;
    };
    const routeColor = r => isStreetcar(r) ? COLORS.streetcar : COLORS.bus;
    // mode: 'streetcar' or 'bus' (replacement buses on streetcar routes are 'bus').
    const netStyle = (mode, z, dim) => ({
      renderer, color: mode === 'streetcar' ? COLORS.streetcar : COLORS.bus, lineCap: 'round', lineJoin: 'round',
      weight: (z >= 15 ? 4 : z >= 13 ? 3 : 1.8) + (mode === 'streetcar' ? 1 : 0),
      opacity: dim ? 0.15 : mode === 'streetcar' ? 0.7 : 0.55,
    });
    let networkLines = [], highlighted = null, highlightLines = [], networkVersion = null, networkRetries = 0;

    // Keep lines under the stops: network at the back, then the highlighted route, then detours.
    // bringToBack puts each line under everything so far, so go from the top layer down.
    function restack() {
      const d = []; detourLayer.eachLayer(l => d.push(l));
      d.reverse().forEach(l => l.bringToBack());
      [...highlightLines].reverse().forEach(l => l.bringToBack());
      networkLines.forEach(l => l.bringToBack());
    }

    async function loadNetwork() {
      try {
        const res = await fetch('api/network');
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        // Schedule lines while the server builds live ones: check again shortly.
        if (data.source !== 'live') setTimeout(loadNetwork, 45000);
        networkRetries = 0;
        if (data.version && data.version === networkVersion) return;     // unchanged
        networkVersion = data.version;
        const z = map.getZoom();
        networkLayer.clearLayers();
        networkLines = [];
        for (const route of data.routes || []) {
          for (const enc of route.lines) {
            const line = L.polyline(decodeLine(enc), netStyle(route.t, z, !!highlighted)).on('click', e => {
              L.DomEvent.stop(e);
              routesAt(e.latlng, route.replacement ? (busBranches(route.r)[0] || route.r) : route.r);
            });
            line.route = route.r;
            line.mode = route.t;
            networkLines.push(line.addTo(networkLayer));
          }
        }
        restack();
      } catch {
        // The map works without route lines, but keep trying (e.g. the server is restarting).
        if (networkRetries < 6) setTimeout(loadNetwork, 5000 * 2 ** networkRetries++);
      }
    }

    map.on('zoomend', () => {
      const z = map.getZoom();
      networkLines.forEach(l => l.setStyle(netStyle(l.mode, z, !!highlighted)));
    });

    // Many streets carry several routes (King St: 504 and 304). A tap there asks which one.
    function routesAt(latlng, tapped) {
      const p = map.latLngToContainerPoint(latlng), found = new Set([tapped]);
      for (const l of networkLines) {
        if (found.has(l.route) || !l.getBounds().pad(0.05).contains(latlng)) continue;
        const pts = l.getLatLngs().map(q => map.latLngToContainerPoint(q));
        for (let i = 1; i < pts.length; i++) {
          if (L.LineUtil.pointToSegmentDistance(p, pts[i - 1], pts[i]) <= 10) { found.add(l.route); break; }
        }
      }
      const list = [...new Set([...found].flatMap(r => [r, ...busBranches(r)]))].sort((a, b) => parseInt(a) - parseInt(b) || a.localeCompare(b));
      if (list.length === 1) return highlightRoute(list[0]);
      const chips = list.map(r => { const sp = splitRoute(r); return `<button type="button" class="chip" data-route="${escapeHtml(r)}" style="background:${sp.bus ? COLORS.bus : routeColor(r)}">${escapeHtml(r)}</button>` +
        ` <span class="meta">${escapeHtml((routeTitles.get(sp.base) || '').replace(/^\d+-/, ''))}${sp.bus ? ' replacement bus' : isStreetcar(r) ? ' streetcar' : ''}</span>`; }).join('<br>');
      L.popup({ maxWidth: 260 }).setLatLng(latlng)
        .setContent(`<div class="popup"><h3>Routes on this street</h3><div class="hint">Tap one to see it on the map</div><div style="margin-top:6px;line-height:2">${chips}</div></div>`)
        .openOn(map);
    }

    // ---- Drawing the highlighted route, one line per direction ---------------------------
    // Each direction gets its own line, shifted a few pixels to its right-hand side (traffic
    // keeps right), with arrows, so eastbound and westbound show side by side on shared
    // streets and apart where they use different streets. Redrawn on zoom (offsets are pixels).
    let hl = null;
    const HL_OFFSET = 4;

    function offsetLine(latlngs, px) {
      const P = latlngs.map(ll => map.latLngToLayerPoint(ll));
      return P.map((p, i) => {
        const a = P[Math.max(0, i - 1)], b = P[Math.min(P.length - 1, i + 1)];
        let dx = b.x - a.x, dy = b.y - a.y; const len = Math.hypot(dx, dy) || 1; dx /= len; dy /= len;
        return map.layerPointToLatLng(L.point(p.x - dy * px, p.y + dx * px));   // right of travel (screen y points down)
      });
    }

    function chevrons(latlngs, every = 120) {
      const P = latlngs.map(ll => map.latLngToLayerPoint(ll)), out = [];
      let next = every / 2, run = 0;
      for (let i = 1; i < P.length; i++) {
        const a = P[i - 1], b = P[i], len = a.distanceTo(b);
        if (!len) continue;
        const dx = (b.x - a.x) / len, dy = (b.y - a.y) / len, nx = -dy, ny = dx;
        while (run + len >= next) {
          const t = next - run, x = a.x + dx * t, y = a.y + dy * t;
          out.push([L.point(x - dx * 3 + nx * 3.5, y - dy * 3 + ny * 3.5), L.point(x + dx * 3, y + dy * 3), L.point(x - dx * 3 - nx * 3.5, y - dy * 3 - ny * 3.5)]
            .map(q => map.layerPointToLatLng(q)));
          next += every;
        }
        run += len;
      }
      return out;
    }

    function drawHighlight() {
      highlightLayer.clearLayers();
      highlightLines = [];
      if (!hl) return;
      const { r, base, bus, color, data, live, changed, notServed, busCovers } = hl;
      const add = (pts, style) => { const l = L.polyline(pts, { renderer, interactive: false, lineCap: 'round', lineJoin: 'round', ...style }); highlightLines.push(l.addTo(highlightLayer)); };
      for (const pts of [...notServed, ...busCovers]) add(pts, { color: '#6b6b70', weight: 5, opacity: 0.9, dashArray: '2 9' });
      const letter = splitRoute(r).letter;
      const dirs = data.directionsComplete ? (data.directions || []).filter(d => bus
        ? d.mode === 'bus' && branchLetter(d.title) === letter
        : isStreetcar(base) ? d.mode === 'streetcar' : true) : [];
      if (dirs.length) {
        for (const d of dirs) {
          const off = offsetLine(decodeLine(d.line), HL_OFFSET);
          add(off, { color: '#ffffff', weight: 8, opacity: 0.95 });
          add(off, { color, weight: 4.5, opacity: 1 });
          for (const c of d.changed || []) add(offsetLine(decodeLine(c), HL_OFFSET), { color: '#f08c00', weight: 4.5, opacity: 1 });
        }
        // Arrows last, so they sit on top of both directions.
        for (const d of dirs) for (const ch of chevrons(offsetLine(decodeLine(d.line), HL_OFFSET))) add(ch, { color: '#ffffff', weight: 2, opacity: 1 });
      } else {
        for (const pts of live) add(pts, { color: '#ffffff', weight: 10, opacity: 0.95 });
        for (const pts of live) add(pts, { color, weight: 6, opacity: 1 });
        for (const pts of changed) add(pts, { color: '#f08c00', weight: 6, opacity: 1 });
      }
      restack();
    }
    map.on('zoomend', () => { if (hl) drawHighlight(); });

    async function highlightRoute(r, opts = {}) {
      highlighted = r;
      map.closePopup();
      if ($('routeFilter').value !== r) $('routeFilter').value = r;
      updateStatus(); drawDetours(); drawGhosts();
      networkLines.forEach(l => l.setStyle(netStyle(l.mode, map.getZoom(), true)));
      const { base, bus } = splitRoute(r);
      const title = routeTitles.get(base) || base;
      const color = bus ? COLORS.bus : routeColor(base);
      $('rcChip').textContent = r;
      $('rcChip').style.background = color;
      $('rcTitle').textContent = bus ? 'replacement bus' : isStreetcar(base) ? 'streetcar' : title.replace(/^\d+-/, '');
      $('rcLegend').innerHTML = '<div class="note">Loading route…</div>';
      $('routeCard').hidden = false;

      let data = null;
      try {
        const res = await fetch('api/route?r=' + encodeURIComponent(base));
        if (!res.ok) throw new Error('HTTP ' + res.status);
        data = await res.json();
      } catch {
        // No server (static hosting): draw the live path straight from the TTC feed, without comparisons.
        try {
          const cfg = (await getJSON(`command=routeConfig&r=${encodeURIComponent(base)}`)).route;
          data = { live: null, liveRaw: asArray(cfg.path).map(p => asArray(p.point).map(x => [+x.lat, +x.lon])), changed: [], notServed: [], replacementBus: [], notServedBusCovers: [], normalSource: null };
        } catch { data = null; }
      }
      if (highlighted !== r) return;          // the viewer picked another route meanwhile
      highlightLayer.clearLayers();
      highlightLines = [];
      if (!data) { $('rcLegend').innerHTML = '<div class="note">Couldn\'t load this route\'s path.</div>'; return; }

      const repBus = (data.replacementBus || []).map(decodeLine), busCovers = (data.notServedBusCovers || []).map(decodeLine);
      const live = bus ? repBus : (data.liveRaw || data.live.map(decodeLine));
      const changed = bus ? [] : data.changed.map(decodeLine), notServed = bus ? [] : data.notServed.map(decodeLine);
      hl = { r, base, bus, color, data, live, changed, notServed, busCovers };
      drawHighlight();

      const hasDetour = !bus && detours.some(d => d.route === base);
      const hasAlert = alerts.some(a => a.route === base && !a.upcoming);
      const item = (style, text) => `<div class="it"><span class="sw" style="${style}"></span>${text}</div>`;
      const linkTo = code => `<button type="button" class="chip" data-route="${escapeHtml(code)}" style="background:${splitRoute(code).bus ? COLORS.bus : routeColor(base)}">${escapeHtml(code)}</button>`;
      let legend;
      if (bus) {
        legend = item(`border-top-color:${COLORS.bus}`, `Where the ${escapeHtml(r)} replacement bus runs, one line per direction (TTC live data)`);
        if (busCovers.length) legend += item('border-top-color:#6b6b70;border-top-style:dotted', `Regular ${escapeHtml(base)} streetcar route it stands in for`);
        legend += `<div class="note">The ${escapeHtml(r)} is a bus that replaces the ${escapeHtml(base)} streetcar on part of its route. ${linkTo(base)} streetcar</div>`;
      } else {
        const codes = busBranches(base);
        legend = item(`border-top-color:${color}`, (data.streetcar ? `Where the ${escapeHtml(base)} streetcar runs now` : 'Where it runs now') + (data.directionsComplete ? ', one line per direction' : '') + ' (TTC live data)');
        if (changed.length) legend += item('border-top-color:#f08c00', data.streetcar ? 'Streetcar off its regular route' : 'Off its regular route');
        if (notServed.length) legend += item('border-top-color:#6b6b70;border-top-style:dotted', data.streetcar ? 'Regular route with no streetcar or bus right now' : 'Regular route, not served right now');
        if (busCovers.length) legend += item('border-top-color:#6b6b70;border-top-style:dotted', `Regular route with no streetcar; ${codes.length ? 'the ' + escapeHtml(codes.join(' / ')) + ' replacement bus covers it' : 'a replacement bus covers it'}`);
        if (hasDetour) legend += item('border-top-color:#f08c00;border-top-style:dashed', 'TTC detour path');
        const src = { openstreetmap: 'OpenStreetMap', schedule: 'the TTC schedule', 'schedule+openstreetmap': 'the TTC schedule and OpenStreetMap' }[data.normalSource] || null;
        if (src && !changed.length && !notServed.length && !busCovers.length)
          legend += `<div class="note">Same as its regular route (from ${src}).${hasAlert ? ' The TTC does report a service change on this route: tap a stop for details.' : ''}</div>`;
        else if (src) legend += `<div class="note">Regular route from ${src}.</div>`;
        if (codes.length) legend += `<div class="note">A replacement bus also runs: ${codes.map(linkTo).join(' ')}</div>`;
      }
      $('rcLegend').innerHTML = legend;

      if (!opts.keepView && live.length) {
        const card = $('routeCard').getBoundingClientRect(), panel = $('panel').getBoundingClientRect();
        map.fitBounds(live.flat(), { paddingTopLeft: [20, panel.bottom + 10], paddingBottomRight: [20, window.innerHeight - card.top + 10] });
      }
    }

    function clearHighlight() {
      highlighted = null;
      hl = null;
      highlightLayer.clearLayers();
      highlightLines = [];
      $('routeCard').hidden = true;
      if ($('routeFilter').value) { $('routeFilter').value = ''; }
      updateStatus(); drawDetours(); drawGhosts();
      networkLines.forEach(l => l.setStyle(netStyle(l.mode, map.getZoom(), false)));
      restack();
    }

    $('rcClose').addEventListener('click', clearHighlight);
    document.addEventListener('click', e => {
      const b = e.target.closest('button.chip[data-route]');
      if (!b) return;
      e.preventDefault();
      highlightRoute(b.dataset.route);
    });

    // ---- Out-of-service stops (OpenStreetMap, via server.js) ------------------------------
    // The TTC removes a stop from its live data while it's out of service, so the regular stop
    // simply vanishes. OpenStreetMap still has it: show it greyed out where a route with a
    // service change is missing a direction, with where to board instead.
    let ghosts = [];

    async function loadGhosts() {
      let data;
      try {
        const res = await fetch('api/osm-stops', { cache: 'no-store' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        data = await res.json();
      } catch { ghosts = []; drawGhosts(); return; }
      const liveIds = new Set([...stops.values()].map(s => s.stopId).filter(Boolean).map(x => String(+x)));
      const next = [];
      for (const o of data.stops || []) {
        if (o.ref && /^\d+$/.test(o.ref) && liveIds.has(String(+o.ref))) continue;   // it's a live stop
        // Stations, loops and terminals: OSM's point rarely matches the TTC's bays there.
        if (/\b(station|loop|terminal|platform|shuttle|go)\b/i.test(o.name)) continue;
        let nearest = Infinity;
        const routes = new Map();
        for (const s of stops.values()) {
          if (Math.abs(s.lat - o.lat) > 0.0012 || Math.abs(s.lon - o.lon) > 0.0016) continue;
          const m = metres(o, s);
          if (m < nearest) nearest = m;
          if (m <= 80) for (const [r, t] of s.routes) if (alerts.some(a => a.route === r && !a.upcoming)) routes.set(r, t);
        }
        if (nearest < 20 || !routes.size) continue;                                   // a live stop is here
        const g = { key: 'osm:' + o.id, ghost: true, lat: o.lat, lon: o.lon, title: o.name || 'Unnamed stop',
                    stopId: '', osmRef: o.ref, routes, tags: new Map() };
        // Which direction would this mapped stop serve? Vehicles stop on their right, so compare
        // its side of the street with the nearest live stop of the route: same side, same
        // direction; across the street, the other one. It's out of service only if no live stop
        // serves that direction here (a mapped stop beside a live one of the same direction is
        // just outdated, like King & University #4736, replaced by #15642 25 m away).
        if (movedStop(g)) continue;
        const all = missingDirections(g);
        g.missing = all.filter(m => sideDirection(g, m.route) === m.word);
        // OSM often maps one stop twice (the pole and the stopping point on the road): keep one.
        if (g.missing.length && !next.some(x => metres(x, g) < 25)) next.push(g);
      }
      ghosts = next;
      drawGhosts();
      refreshArrivals?.();          // an open popup may describe a direction an out-of-service stop now covers
    }

    function drawGhosts() {
      ghostLayer.clearLayers();
      const routeTag = $('routeFilter').value, z = map.getZoom();
      for (const g of ghosts) {
        if (routeTag && !g.routes.has(splitRoute(routeTag).base)) continue;
        g.marker = L.circleMarker([g.lat, g.lon], {
          renderer, radius: stopRadius(z, false), weight: stopWeight(z, false), color: '#fff', fillColor: '#9a9aa0', fillOpacity: 0.95,
        }).bindPopup(() => ghostPopupHtml(g), popupOptions()).addTo(ghostLayer);
      }
    }

    // A live stop within 40 m on the same side of the street means the mapped stop was moved or
    // renumbered (OSM not updated), not closed.
    function movedStop(g) {
      for (const s of stops.values()) {
        if (Math.abs(s.lat - g.lat) > 0.0005 || Math.abs(s.lon - g.lon) > 0.0007 || metres(g, s) > 40) continue;
        cornerOf(s);
        if (!s.travel) continue;
        const right = { north: [1, 0], east: [0, -1], south: [-1, 0], west: [0, 1] }[s.travel];
        const across = (g.lon - s.lon) * M_LON * right[0] + (g.lat - s.lat) * M_LAT * right[1];
        if (across > -8) return true;
      }
      return false;
    }

    function sideDirection(g, route) {
      let best = null;
      for (const s of stops.values()) {
        if (!s.routes.has(route) || Math.abs(s.lat - g.lat) > 0.0012 || Math.abs(s.lon - g.lon) > 0.0016) continue;
        const m = metres(g, s);
        if (m > 150 || (best && m >= best.m)) continue;
        const d = (routeDirs.get(route) || []).find(d => d.keys.includes(s.key));
        cornerOf(s);                                          // sets s.travel (physical heading)
        if (d && s.travel) best = { s, m, word: dirWord(d.title) };
      }
      if (!best) return null;
      // How far the mapped stop is to the right of the live stop, across the street.
      const right = { north: [1, 0], east: [0, -1], south: [-1, 0], west: [0, 1] }[best.s.travel];   // unit [east, north]
      const across = (g.lon - best.s.lon) * M_LON * right[0] + (g.lat - best.s.lat) * M_LAT * right[1];
      if (across > -8) return best.word;                     // same side of the street
      const words = new Set((routeDirs.get(route) || []).map(d => dirWord(d.title)).filter(Boolean));
      return [...words].find(w => w !== best.word && OPPOSITE[w] === best.word) || [...words].find(w => w !== best.word) || null;
    }

    function ghostPopupHtml(g) {
      const routes = [...new Set(g.missing.map(x => x.route))].sort((a, b) => parseInt(a) - parseInt(b));
      const chips = routes.map(t => `<span class="chip" style="background:#8a8a90">${escapeHtml(t)}</span>`).join('');
      return `<div class="popup"><h3>${escapeHtml(g.title)}</h3>
        <div class="meta">Not in service right now${g.osmRef ? ' · stop #' + escapeHtml(g.osmRef) : ''}</div>${chips}
        <div class="arrivals">` + boardingHtml(g) + advisoryHtml(g, stopDisruptions(g).filter(d => !d.bypass)) +
        `<div class="none">This stop is on the street (mapped in OpenStreetMap) but isn't in the TTC's live data right now, so no vehicles are expected to stop here.</div></div></div>`;
    }

    // Tapping a suggested stop jumps to it and opens its popup.
    document.addEventListener('click', e => {
      const a = e.target.closest('a[data-goto]');
      if (!a) return;
      e.preventDefault();
      const s = stops.get(a.dataset.goto);
      if (!s) return;
      if (!s.marker || !layer.hasLayer(s.marker)) { $('search').value = ''; $('routeFilter').value = ''; updateStatus(); }
      map.setView([s.lat, s.lon], Math.max(map.getZoom(), 16));
      s.marker?.openPopup();
    });

    // ---- Next-vehicle predictions -------------------------------------------
    let arrivalsTimer = null, arrivalsSeq = 0, refreshArrivals = null;

    function stopArrivals() { clearInterval(arrivalsTimer); arrivalsTimer = null; arrivalsSeq++; refreshArrivals = null; }

    function startArrivals(stop, popup) {
      stopArrivals();
      const seq = arrivalsSeq;
      const refresh = async () => {
        await loadOccupancy();
        let html;
        try { html = arrivalsHtml(await fetchPredictions(stop), stop); }
        catch (e) { html = `<div class="none">Couldn't load arrival times (${escapeHtml(e.message)}).</div>`; }
        if (seq !== arrivalsSeq) return;   // popup closed or another stop opened meanwhile
        const el = popupEl(stop).querySelector('.arrivals');
        if (el) { el.innerHTML = html; popup.update(); }
      };
      refreshArrivals = refresh;
      refresh();
      arrivalsTimer = setInterval(refresh, 30000);
    }

    async function fetchPredictions(stop) {
      if (stop.stopId) {
        return asArray((await getJSON(`command=predictions&stopId=${encodeURIComponent(stop.stopId)}`, 2)).predictions);
      }
      // Stops without a public stop number: ask per route, ignoring routes that error.
      const results = await Promise.allSettled([...stop.tags].map(([r, s]) =>
        getJSON(`command=predictions&r=${encodeURIComponent(r)}&s=${encodeURIComponent(s)}`, 1)));
      const ok = results.filter(x => x.status === 'fulfilled');
      if (!ok.length && results.length) throw results[0].reason;
      return ok.flatMap(x => asArray(x.value.predictions));
    }

    function arrivalsHtml(predictions, stop) {
      const disruptions = stopDisruptions(stop);
      const bypassed = (route, dirTitle) => disruptions.some(d => d.bypass && d.route === route && dirMatches(d.alert.direction, dirTitle));
      const rows = [];
      for (const p of predictions) {
        for (const d of asArray(p.direction)) {
          const list = asArray(d.prediction).filter(x => +x.seconds >= 0).sort((a, b) => a.seconds - b.seconds).slice(0, 3);
          if (!list.length) continue;
          rows.push({
            route: p.routeTag, dir: d.title, first: +list[0].seconds, preds: list.map(x => +x.seconds), vehicles: list.map(x => x.vehicle),
            bypassed: bypassed(p.routeTag, d.title),
            // Streetcar routes run buses on "...Bus" branches when streetcars are replaced.
            shuttle: isStreetcar(p.routeTag) && list.some(x => /bus/i.test(x.dirTag || '')),
          });
        }
      }
      rows.sort((a, b) => a.bypassed - b.bypassed || a.first - b.first);
      const servedBy = stop.stopId ? (detourStopIndex.get(stop.stopId) || []) : [];
      const detourHere = servedBy.map(d => `<div class="advisory"><div class="head">The ${escapeHtml(d.route)} detour stops here</div>` +
        `${escapeHtml(d.route)} towards ${escapeHtml(d.headsign || '')}${d.times[stop.stopId]?.length ? ' · <b>' + d.times[stop.stopId].map(minsFrom).join(', ') + '</b>' : ''}` +
        `<div class="src">From the TTC's trip data for detoured buses; this stop isn't on the ${escapeHtml(d.route)}'s regular route</div></div>`).join('');
      const advisory = detourHere + advisoryHtml(stop, disruptions.filter(d => d.bypass)) + boardingHtml(stop) + detourNoteHtml(stop) +
                       (alertsOk === false ? '' : advisoryHtml(stop, disruptions.filter(d => !d.bypass)));
      const fmt = sec => sec < 60 ? 'Due' : Math.floor(sec / 60) + ' min';
      const now = new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
      // Times first, then what affects this stop, then general route notices.
      if (!rows.length) return `<div class="none">No vehicles predicted right now.</div><div class="updated">Checked ${now}</div>` + advisory;
      return rows.map(r => `<div class="row${r.bypassed ? ' bypassed' : ''}">
          <span class="chip" style="background:${isStreetcar(r.route) && !r.shuttle ? COLORS.streetcar : COLORS.bus}">${escapeHtml(branchCode(r.route, r.dir))}</span>
          <div><div class="times">${r.preds.map((t, i) => `<span class="t">${fmt(t)}${crowdTag(r.vehicles[i])}</span>`).join('')}</div>${r.bypassed ? '<span class="flag">Detoured: won\'t stop here</span>' : ''}
          <div class="dir">${escapeHtml((DIR_NAME[dirWord(r.dir)] ? DIR_NAME[dirWord(r.dir)] + ' · ' : '') + branchName([r.route], r.dir))}</div></div>
        </div>`).join('') + `<div class="updated">Live · updated ${now} · refreshes every 30s${rows.some(r => r.vehicles.some(v => occupancy[v])) ? ' · bars: how full (TTC data)' : ''}</div>` + advisory;
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    function render() {
      const showBus = $('showBus').checked, showCar = $('showStreetcar').checked;
      const routeTag = $('routeFilter').value;
      const q = $('search').value.trim().toLowerCase();
      layer.clearLayers();
      let shown = 0;
      for (const [key, stop] of stops) {
        if (routeTag && !stopOnRoute(stop, routeTag)) continue;
        if (q && !stop.title.toLowerCase().includes(q) && !(stop.stopId || '').includes(q)) continue;
        // Only count route types the user has switched on.
        const visibleRoutes = [...stop.routes.keys()].filter(t => isStreetcarAt(stop, t) ? showCar : showBus);
        if (!visibleRoutes.length) continue;
        // With one route picked, colour its stops by that route (506B = bus, 506 = streetcar).
        const kind = routeTag ? (splitRoute(routeTag).bus || !isStreetcar(routeTag) ? 'bus' : 'streetcar') : stopKind(stop, visibleRoutes);
        const hit = affectedKeys.has(key);
        const onDetour = !hit && stop.stopId && detourStopIndex.has(stop.stopId);
        stop.hit = hit || onDetour;
        // Bus and streetcar at one stop: half red, half green instead of a third colour.
        stop.marker = (kind === 'both' ? splitMarker : L.circleMarker)([stop.lat, stop.lon], {
          renderer, radius: stopRadius(map.getZoom(), hit || onDetour), weight: stopWeight(map.getZoom(), hit || onDetour), color: hit || onDetour ? '#f08c00' : '#fff',
          dashArray: onDetour ? '3 2' : null,
